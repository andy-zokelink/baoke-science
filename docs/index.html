<!DOCTYPE html>
<html lang=zh-CN>
<head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>宝科科学备考 — Harry 学习追踪</title>
<style>
:root{
  --bg:#f0f5ff;--bg2:#e8eef8;--card:#fff;--card2:#f8faff;
  --text:#1e293b;--text2:#475569;--text3:#94a3b8;
  --accent:#2563eb;--accent2:#3b82f6;--accent-light:#dbeafe;--accent-dark:#1d4ed8;
  --border:#cbd5e1;--border2:#e2e8f0;
  --green:#16a34a;--green-light:#dcfce7;--red:#dc2626;--red-light:#fee2e2;
  --orange:#ea580c;--orange-light:#fed7aa;--amber:#d97706;--amber-light:#fef3c7;
  --purple:#7c3aed;--purple-light:#e9d5ff;--teal:#0d9488;--teal-light:#ccfbf1;
  --pink:#db2777;--pink-light:#fce7f3;
  --sh:0 1px 3px rgba(0,0,0,.08);--shm:0 4px 16px rgba(0,0,0,.1);--shl:0 8px 32px rgba(0,0,0,.12);
  --nav-h:52px;--tab-h:42px;--max-w:1200px;--r:12px;
}
[data-theme=dark]{
  --bg:#0b1120;--bg2:#111827;--card:#1e293b;--card2:#1a2332;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --accent:#3b82f6;--accent2:#60a5fa;--accent-light:#1e3a5f;--accent-dark:#2563eb;
  --border:#334155;--border2:#1e293b;
  --green:#22c55e;--green-light:#14532d;--red:#ef4444;--red-light:#450a0a;
  --orange:#f97316;--orange-light:#431407;--amber:#f59e0b;--amber-light:#422006;
  --purple:#a855f7;--purple-light:#3b0764;--teal:#14b8a6;--teal-light:#134e4a;
  --pink:#ec4899;--pink-light:#500724;
  --sh:0 1px 3px rgba(0,0,0,.3);--shm:0 4px 16px rgba(0,0,0,.4);--shl:0 8px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6;
  transition:background .3s,color .3s;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.nav{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#1e40af,#2563eb,#3b82f6);color:#fff;box-shadow:0 2px 12px rgba(37,99,235,.3)}
.nav-in{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;max-width:var(--max-w);margin:0 auto}
.nav h1{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.nav h1 .badge{font-size:10px;background:rgba(255,255,255,.2);padding:1px 7px;border-radius:10px;font-weight:400}
.theme-btn{background:rgba(255,255,255,.2);border:none;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.theme-btn:hover{background:rgba(255,255,255,.35)}
.tabs{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:48px;z-index:99;scrollbar-width:none;box-shadow:var(--sh);gap:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:0 14px;height:var(--tab-h);display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--text2);cursor:pointer;border:none;background:transparent;border-bottom:2.5px solid transparent;transition:all .25s;white-space:nowrap;letter-spacing:.2px}
.tab:hover{color:var(--accent);background:var(--accent-light)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-light)}
.tab .ico{font-size:15px}
.main{max-width:var(--max-w);margin:0 auto;padding:0}
.tab-pane{display:none;padding:16px;animation:fadeIn .35s ease}
.tab-pane.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh);border:1px solid var(--border2);transition:all .25s}
.card:hover{box-shadow:var(--shm)}
.card-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title .ico{font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.flex{display:flex;gap:12px;flex-wrap:wrap}
.flex-c{display:flex;flex-direction:column;gap:12px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:var(--r);padding:14px;text-align:center;border:1px solid var(--border2);box-shadow:var(--sh)}
.stat-card .num{font-size:28px;font-weight:800;line-height:1.2}
.stat-card .lbl{font-size:12px;color:var(--text2);margin-top:2px}
.stat-card .sub{font-size:10.5px;color:var(--text3);margin-top:1px}
.tier-group{margin-bottom:12px}
.tier-hdr{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--r);cursor:pointer;font-weight:700;font-size:14px;transition:all .2s;user-select:none;border:1px solid var(--border2)}
.tier-hdr .arrow{transition:transform .3s;font-size:12px}
.tier-hdr.open .arrow{transform:rotate(90deg)}
.tier-hdr .count{font-size:11px;font-weight:400;margin-left:auto;opacity:.7}
.tier-body{padding:8px 0 4px 8px;display:none}
.tier-body.open{display:block}
.concept-item{padding:10px 12px;margin-bottom:6px;border-radius:8px;background:var(--bg2);border:1px solid var(--border2);cursor:pointer;transition:all .2s}
.concept-item:hover{border-color:var(--accent)}
.concept-item .ci-name{font-weight:600;font-size:13px}
.concept-item .ci-def{font-size:12px;color:var(--text2);margin-top:4px;display:none;line-height:1.5}
.concept-item .ci-def.show{display:block}
.concept-item .ci-def .lbl{color:var(--accent);font-weight:600;font-size:11px}
.wrong-item{padding:12px;margin-bottom:8px;border-radius:var(--r);background:var(--card);border:1px solid var(--border2);box-shadow:var(--sh)}
.wrong-item .wi-q{font-size:13px;font-weight:600;margin-bottom:4px}
.wrong-item .wi-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.wrong-item .wi-tag{font-size:10.5px;padding:1px 7px;border-radius:4px;background:var(--red-light);color:var(--red)}
.wrong-item .wi-resp{font-size:12px;color:var(--text2);margin-bottom:2px}
.wrong-item .wi-cause{font-size:11.5px;color:var(--orange);padding:6px 8px;background:var(--orange-light);border-radius:6px;margin-top:4px}
.wrong-item .wi-strat{font-size:11.5px;color:var(--teal);padding:6px 8px;background:var(--teal-light);border-radius:6px;margin-top:4px}
.graph-wrap{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--border2);position:relative;min-height:500px}
.graph-wrap svg{width:100%;height:100%;min-height:500px}
.graph-tip{position:absolute;background:var(--card);color:var(--text);padding:10px 14px;border-radius:8px;box-shadow:var(--shl);border:1px solid var(--border);font-size:12.5px;pointer-events:none;display:none;z-index:10;max-width:300px;line-height:1.5}
.graph-controls{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.kp-group{margin-bottom:10px}
.kp-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:var(--r);cursor:pointer;font-weight:600;background:var(--red-light);border:1px solid rgba(220,38,38,.15);transition:all .2s;font-size:13px}
.kp-hdr .count-badge{background:var(--red);color:#fff;padding:1px 8px;border-radius:10px;font-size:11px}
.kp-body{display:none;padding:8px 0 0 8px}
.kp-body.open{display:block}
.plan-day{padding:12px;margin-bottom:8px;border-radius:var(--r);background:var(--card);border:1px solid var(--border2);border-left:4px solid var(--accent)}
.plan-day.done{border-left-color:var(--green);opacity:.75}
.plan-day .pd-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.plan-day .pd-title{font-weight:700;font-size:14px}
.plan-day .pd-badge{font-size:10.5px;padding:1px 8px;border-radius:8px}
.plan-day .pd-items{font-size:12.5px;color:var(--text2);line-height:1.6}
.plan-day .pd-item{padding:3px 0;display:flex;align-items:baseline;gap:6px}
.plan-day .pd-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.page-card{padding:12px;margin-bottom:8px;border-radius:var(--r);background:var(--card);border:1px solid var(--border2);cursor:pointer;transition:all .2s}
.page-card:hover{border-color:var(--accent)}
.page-card .pc-hdr{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:13px}
.page-card .pc-summary{font-size:12px;color:var(--text2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.page-card .pc-summary.hide{display:none}
.page-card .pc-full{display:none;font-size:12px;color:var(--text2);margin-top:8px;line-height:1.7;background:var(--bg2);padding:10px;border-radius:8px;max-height:400px;overflow-y:auto;white-space:pre-wrap}
.page-card .pc-full.show{display:block}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;border:none;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark);box-shadow:0 2px 8px rgba(37,99,235,.3)}
.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn-outline:hover{background:var(--accent-light)}
.btn-sm{padding:4px 10px;font-size:11px}
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut{width:120px;height:120px;border-radius:50%;position:relative;background:var(--border2);flex-shrink:0}
.donut-seg{position:absolute;width:100%;height:100%;border-radius:50%}
.donut-seg.half{clip:rect(0,120px,120px,60px)}
.donut-seg.cover{clip:rect(0,60px,120px,0)}
.donut-hole{position:absolute;width:84px;height:84px;background:var(--card);border-radius:50%;top:18px;left:18px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.donut-hole .val{font-size:22px;font-weight:800;line-height:1}
.donut-hole .lbl{font-size:10px;color:var(--text3)}
.donut-legend{font-size:12px;display:flex;flex-direction:column;gap:4px}
.donut-legend .dl-item{display:flex;align-items:center;gap:6px}
.donut-legend .dl-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px}
.empty .ico{font-size:40px;margin-bottom:8px;display:block}
.bar-chart{margin:8px 0}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.bar-row .bar-lbl{font-size:11.5px;flex:0 0 120px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bar-track{flex:1;height:14px;background:var(--border2);border-radius:7px;overflow:hidden}
.bar-row .bar-fill{height:100%;border-radius:7px;transition:width 1s ease;min-width:2px}
.bar-row .bar-val{font-size:11px;flex:0 0 30px;color:var(--text2)}
.dot-core-bg{background:var(--red-light);border-left:3px solid var(--red)}
.dot-common-bg{background:var(--accent-light);border-left:3px solid var(--accent)}
.dot-error-bg{background:var(--orange-light);border-left:3px solid var(--orange)}
.dot-edge-bg{background:var(--bg2);border-left:3px solid var(--text3)}
.anim-count{animation:countUp .4s ease}
@keyframes countUp{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@media(max-width:480px){
  .nav h1{font-size:14px}.nav h1 .badge{display:none}
  .tab{padding:0 10px;font-size:11px}.tab .ico{font-size:13px}
  .tab-pane{padding:10px}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .stat-card{padding:10px}.stat-card .num{font-size:22px}
  .wrong-item{padding:10px}
  .graph-wrap{min-height:320px}.graph-wrap svg{min-height:320px}
  .donut{width:90px;height:90px}.donut-seg.half{clip:rect(0,90px,90px,45px)}
  .donut-seg.cover{clip:rect(0,45px,90px,0)}
  .donut-hole{width:64px;height:64px;top:13px;left:13px}
  .donut-hole .val{font-size:18px}
  .bar-row .bar-lbl{flex:0 0 80px;font-size:10.5px}
}
@media print{.nav,.tabs,.theme-btn,.graph-controls{display:none}.tab-pane{display:block!important}}
</style>
</head>
<body>
<nav class=nav>
<div class=nav-in>
<h1>🔬 科学备考 <span class=badge>Harry · 六年级</span></h1>
<div style=display:flex;gap:8px;align-items:center>
<span id=themeLabel style=font-size:11px;opacity:.7>🌙</span>
<button class=theme-btn onclick=toggleTheme() aria-label=主题>🌓</button>
</div>
</div>
</nav>
<div class=tabs id=tabs>
<button class="tab active" data-tab=0><span class=ico>📊</span> 总览</button>
<button class=tab data-tab=1><span class=ico>🧠</span> 知识图谱</button>
<button class=tab data-tab=2><span class=ico>❌</span> 错题诊疗</button>
<button class=tab data-tab=3><span class=ico>🔮</span> 概念网络</button>
<button class=tab data-tab=4><span class=ico>📅</span> 学习计划</button>
<button class=tab data-tab=5><span class=ico>📖</span> 教材溯源</button>
</div>
<div class=main>

<!-- TAB 0: DASHBOARD -->
<div class="tab-pane active" id=pane0>
<div class=stat-row id=statRow></div>
<div class=grid2>
<div class=card><div class=card-title><span class=ico>🎯</span> 掌握率</div><div id=masteryDonut class=donut-wrap></div></div>
<div class=card><div class=card-title><span class=ico>📈</span> 概念分布</div><div id=conceptDistChart></div></div>
</div>
<div class=grid2 style=margin-top:12px>
<div class=card><div class=card-title><span class=ico>⚠️</span> 薄弱知识点 TOP10</div><div id=weakKpChart></div></div>
<div class=card><div class=card-title><span class=ico>🏆</span> 学习建议</div><div id=dashAdvice></div></div>
</div>
</div>

<!-- TAB 1: KNOWLEDGE MAP -->
<div class=tab-pane id=pane1>
<div class=card style=margin-bottom:12px>
<div class=flex style=align-items:center;gap:8px;margin-bottom:8px>
<input type=text id=conceptSearch placeholder="🔍 搜索概念..." style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);color:var(--text);outline:none" oninput=filterConcepts()>
<select id=conceptFilter onchange=filterConcepts() style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);color:var(--text);outline:none">
<option value=all>全部</option>
<option value=核心概念>⭐ 核心概念</option>
<option value=常考概念>📘 常考概念</option>
<option value=易错概念>⚠️ 易错概念</option>
<option value=边缘概念>🌱 边缘概念</option>
</select>
</div>
<div id=conceptCountBar style=font-size:12px;color:var(--text3);margin-bottom:8px></div>
</div>
<div id=conceptMapContainer></div>
</div>

<!-- TAB 2: WRONG CLINIC -->
<div class=tab-pane id=pane2>
<div class=card style=margin-bottom:12px>
<div class=flex style=align-items:center;gap:8px>
<input type=text id=wrongSearch placeholder="🔍 搜索错题..." style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);color:var(--text);outline:none" oninput=filterWrongs()>
<select id=wrongSort onchange=renderWrongClinic() style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);color:var(--text);outline:none">
<option value=kp>按知识点分组</option>
<option value=all>全部列表</option>
</select>
</div>
<div style=font-size:12px;color:var(--text3);margin-top:6px>共 <strong id=wrongCount></strong> 道错题，<strong id=wrongKpCount></strong> 个知识点</div>
</div>
<div id=wrongClinicContainer></div>
</div>

<!-- TAB 3: KNOWLEDGE GRAPH -->
<div class=tab-pane id=pane3>
<div class=graph-controls>
<button class="btn btn-sm btn-outline" onclick=resetGraphView()>🔄 重置</button>
<select id=graphFilter onchange=filterGraph() style="padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px;background:var(--card);color:var(--text);outline:none">
<option value=all>全部概念</option>
<option value=核心概念>⭐ 核心概念</option>
<option value=常考概念>📘 常考概念</option>
<option value=易错概念>⚠️ 易错概念</option>
<option value=边缘概念>🌱 边缘概念</option>
</select>
<span style=font-size:12px;color:var(--text3)>拖动节点 · 滚轮缩放</span>
</div>
<div class=graph-wrap id=graphWrap>
<svg id=graphSvg></svg>
<div class=graph-tip id=graphTip></div>
</div>
</div>

<!-- TAB 4: STUDY PLAN -->
<div class=tab-pane id=pane4>
<div class=card style=margin-bottom:12px>
<div style=display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px>
<div><span class=ico>📅</span> <strong>智能复习计划</strong><span style=font-size:12px;color:var(--text3);margin-left:8px>基于错题分布与概念优先级生成</span></div>
<button class="btn btn-sm btn-primary" onclick=generatePlan()>🔄 重新生成</button>
</div>
</div>
<div id=planContainer></div>
</div>

<!-- TAB 5: TEXTBOOK SOURCE -->
<div class=tab-pane id=pane5>
<div class=card style=margin-bottom:12px>
<div class=flex style=align-items:center;gap:8px>
<input type=text id=pageSearch placeholder="🔍 搜索教材内容..." style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);color:var(--text);outline:none" oninput=filterPages()>
<select id=pageSort onchange=renderPages() style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);color:var(--text);outline:none">
<option value=asc>页码正序</option>
<option value=desc>页码倒序</option>
</select>
</div>
<div style=font-size:12px;color:var(--text3);margin-top:6px>共 <strong id=pageCount></strong> 页教材</div>
</div>
<div id=pageContainer></div>
</div>
</div>

<script src=data.js></script>
<script>
(function(){
const _Q = BAOKE_DATA.questions;
const _C = BAOKE_DATA.concepts;
const _P = BAOKE_DATA.source_pages;
const _S = BAOKE_DATA.stats;
const _ST = BAOKE_DATA.student;
const _CR = BAOKE_DATA.course;
const wrongQ = _Q.filter(q => q.is_correct === '✗');
const correctQ = _Q.filter(q => q.is_correct === '✓');
const tierOrder = ['核心概念','常考概念','易错概念','边缘概念'];
const tierColors = {'核心概念':'var(--red)','常考概念':'var(--accent)','易错概念':'var(--orange)','边缘概念':'var(--text3)'};
const conceptMap = {}; _C.forEach(c => conceptMap[c.id] = c);
function $(id){return document.getElementById(id)}
function esc(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function limitStr(s,n){return s&&s.length>n?s.slice(0,n)+'…':s||'';}

/* THEME */
function toggleTheme(){
  const d = document.documentElement;
  const isDark = d.getAttribute('data-theme') === 'dark';
  d.setAttribute('data-theme', isDark ? '' : 'dark');
  $('themeLabel').textContent = isDark ? '🌙' : '☀️';
  localStorage.setItem('baoke-theme', isDark ? 'light' : 'dark');
}
(function(){
  const saved = localStorage.getItem('baoke-theme');
  if(saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme:dark)').matches)){
    document.documentElement.setAttribute('data-theme','dark');
    $('themeLabel').textContent = '☀️';
  }
})();

/* TABS */
(function(){
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(t => t.addEventListener('click', function(){

/* === KNOWLEDGE GRAPH === */
let graphNodes=[],graphEdges=[],graphTransform={x:0,y:0,scale:1};
function buildGraphData(filter='all'){
  let concepts=_C;if(filter!=='all')concepts=concepts.filter(c=>c.type_name===filter);
  graphNodes=concepts.map((c,i)=>({id:c.id,name:c.name,type:c.type_name,priority:c.priority,x:200+Math.random()*600,y:150+Math.random()*400,vx:0,vy:0,r:c.priority===1?10:c.priority===2?8:c.priority===3?7:6}));
  const kpConcepts={};
  _Q.forEach(q=>{if(q.knowledge_point&&q.concept_id){if(!kpConcepts[q.knowledge_point])kpConcepts[q.knowledge_point]=new Set();kpConcepts[q.knowledge_point].add(q.concept_id);}});
  const edgeSet=new Set();graphEdges=[];
  Object.values(kpConcepts).forEach(conIds=>{
    const arr=[...conIds].filter(id=>graphNodes.some(n=>n.id===id));
    for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){const key=Math.min(arr[i],arr[j])+'-'+Math.max(arr[i],arr[j]);if(!edgeSet.has(key)){edgeSet.add(key);graphEdges.push({source:arr[i],target:arr[j],weight:1});}else{const e=graphEdges.find(e=>e.source===Math.min(arr[i],arr[j])&&e.target===Math.max(arr[i],arr[j]));if(e)e.weight++;}}
  });
  const nodeIds=new Set(graphNodes.map(n=>n.id));
  graphEdges=graphEdges.filter(e=>nodeIds.has(e.source)&&nodeIds.has(e.target));
  graphEdges.sort((a,b)=>b.weight-a.weight);
  graphEdges=graphEdges.slice(0,Math.max(graphNodes.length*2,50));
}
function runForceLayout(iterations=200){
  const nodes=graphNodes,edges=graphEdges,cx=500,cy=400,repulsion=800000,attraction=0.003,damping=0.85,centerForce=0.002;
  const typeRadii={'核心概念':80,'常考概念':180,'易错概念':280,'边缘概念':360};
  nodes.forEach((n,i)=>{const radius=typeRadii[n.type]||200;const angle=(i/nodes.length)*Math.PI*2+Math.random()*0.1;n.x=cx+Math.cos(angle)*radius*(0.8+Math.random()*0.4);n.y=cy+Math.sin(angle)*radius*(0.8+Math.random()*0.4);});
  for(let iter=0;iter<iterations;iter++){const k=1-iter/iterations;
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){let dx=nodes[j].x-nodes[i].x,dy=nodes[j].y-nodes[i].y,dist=Math.sqrt(dx*dx+dy*dy)||1;let force=repulsion/(dist*dist)*k,fx=dx/dist*force,fy=dy/dist*force;nodes[i].vx-=fx;nodes[i].vy-=fy;nodes[j].vx+=fx;nodes[j].vy+=fy;}
    for(const e of edges){const si=nodes.findIndex(n=>n.id===e.source),ti=nodes.findIndex(n=>n.id===e.target);if(si===-1||ti===-1)continue;const dx=nodes[ti].x-nodes[si].x,dy=nodes[ti].y-nodes[si].y,dist=Math.sqrt(dx*dx+dy*dy)||1;const ideal=80+(e.weight||1)*10,f=(dist-ideal)*attraction*k;nodes[si].vx+=dx/dist*f;nodes[si].vy+=dy/dist*f;nodes[ti].vx-=dx/dist*f;nodes[ti].vy-=dy/dist*f;}
    for(const n of nodes){n.vx+=(cx-n.x)*centerForce*k;n.vy+=(cy-n.y)*centerForce*k;n.vx*=damping;n.vy*=damping;n.x+=n.vx;n.y+=n.vy;}
  }
}
function renderGraph(){
  const svg=$('graphSvg'),wrap=$('graphWrap'),w=wrap.clientWidth||1000,h=Math.max(wrap.clientHeight||600,500);
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  const nodeMap={};graphNodes.forEach(n=>nodeMap[n.id]=n);
  const maxWeight=Math.max(...graphEdges.map(e=>e.weight),1);
  let html='<g transform="translate('+graphTransform.x+','+graphTransform.y+') scale('+graphTransform.scale+')">';
  for(const e of graphEdges){const s=nodeMap[e.source],t=nodeMap[e.target];if(!s||!t)continue;const op=0.15+(e.weight/maxWeight)*0.4;html+='<line x1="'+s.x+'" y1="'+s.y+'" x2="'+t.x+'" y2="'+t.y+'" stroke="var(--accent)" stroke-opacity="'+op+'" stroke-width="'+(0.5+e.weight/maxWeight*1.5)+'"/>';}
  for(const n of graphNodes){const color=tierColors[n.type]||'var(--text3)';html+='<g class=gn data-id="'+n.id+'" transform="translate('+n.x.toFixed(1)+','+n.y.toFixed(1)+')" style=cursor:pointer><circle r="'+n.r+'" fill="'+color+'" stroke="#fff" stroke-width="1.5" opacity=".85"><title>'+esc(n.name)+'</title></circle><text y="'+(n.r+12)+'" text-anchor="middle" font-size="'+(n.r>8?9:7)+'" fill="var(--text)" font-weight="600" style="text-shadow:0 0 2px var(--card)">'+(n.name.length>6?n.name.slice(0,5)+'…':n.name)+'</text></g>';}
  html+='</g>';svg.innerHTML=html;
  svg.querySelectorAll('.gn').forEach(g=>{g.addEventListener('mouseenter',e=>{const id=parseInt(g.dataset.id);const n=graphNodes.find(nd=>nd.id===id);const c=_C.find(cc=>cc.id===id);if(!n)return;const tip=$('graphTip');tip.innerHTML='<strong>'+esc(n.name)+'</strong><br><span style=font-size:11px;color:'+tierColors[n.type]+'>'+n.type+'</span>'+(c&&c.definition?'<br><span style=font-size:11px>'+esc(c.definition.slice(0,120))+'</span>':'');tip.style.display='block';const rect=wrap.getBoundingClientRect();let x=e.clientX-rect.left+12,y=e.clientY-rect.top+12;if(x+200>rect.width)x=e.clientX-rect.left-200;if(y+100>rect.height)y=e.clientY-rect.top-80;tip.style.left=x+'px';tip.style.top=y+'px';});g.addEventListener('mouseleave',()=>{$('graphTip').style.display='none';});});
  let dragNode=null,dragOff={x:0,y:0};
  function pos(e){const rect=svg.getBoundingClientRect();return{x:(e.clientX-rect.left-graphTransform.x)/graphTransform.scale,y:(e.clientY-rect.top-graphTransform.y)/graphTransform.scale};}
  function findNode(x,y){for(let i=graphNodes.length-1;i>=0;i--){const n=graphNodes[i];if((x-n.x)**2+(y-n.y)**2<(n.r+5)**2)return n;}return null;}
  svg.onpointerdown=e=>{const p=pos(e),n=findNode(p.x,p.y);if(n){dragNode=n;dragOff={x:p.x-n.x,y:p.y-n.y};svg.setPointerCapture(e.pointerId);e.preventDefault();}};
  svg.onpointermove=e=>{if(dragNode){const p=pos(e);dragNode.x=p.x-dragOff.x;dragNode.y=p.y-dragOff.y;renderGraph();}};
  svg.onpointerup=()=>{dragNode=null;};
  svg.onwheel=e=>{e.preventDefault();const d=e.deltaY>0?.9:1.1;graphTransform.scale=Math.min(Math.max(graphTransform.scale*d,.1),5);const rect=svg.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;graphTransform.x=mx-(mx-graphTransform.x)*d;graphTransform.y=my-(my-graphTransform.y)*d;renderGraph();};
}
function resetGraphView(){graphTransform={x:0,y:0,scale:1};setTimeout(filterGraph,50);}
function filterGraph(){buildGraphData($('graphFilter').value);runForceLayout(150);renderGraph();}
function runGraph(){if(!graphNodes.length)filterGraph();}
window.addEventListener('resize',()=>{if(graphNodes.length)renderGraph();});

  const prioTop5=prioritized.slice(0,5).map((p,i)=>'<div style=padding:2px 0;font-size:12.5px>'+(i+1)+'. '+esc(p.concept.name)+' '+('🔴'.repeat(Math.min(p.errors,5)))+' ('+p.errors+'次错误)</div>').join('');

    let preview=p.ocr_text||'';try{const parsed=JSON.parse(p.ocr_text);if(Array.isArray(parsed))preview=parsed.map(item=>item.题目||item.question||JSON.stringify(item)).filter(Boolean).join(' | ');}catch(e){}
    const summary=preview.slice(0,150)+(preview.length>150?'…':'');
    return '<div class=page-card onclick="this.querySelector(\'.pc-full\')?.classList.toggle(\'show\');this.querySelector(\'.pc-summary\')?.classList.toggle(\'hide\')"><div class=pc-hdr><span>📄 第'+p.page_number+'页 · '+(p.material_title||'科学教材')+'</span><span style=font-size:11px;color:var(--text3)>点击展开</span></div><div class=pc-summary>'+esc(summary)+'</div><div class=pc-full>'+esc(preview.slice(0,3000))+'</div></div>';
  }).join(''):'<div class=empty><span class=ico>🔍</span>未找到匹配内容</div>';
}
function filterPages(){renderPages();}
renderPages();

console.log('宝科科学备考 · '+_Q.length+'题 '+_C.length+'概念 '+wrongQ.length+'错题');
})();
</script>
