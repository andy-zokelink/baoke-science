<!DOCTYPE html>
<html lang=zh-CN>
<head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>宝科科学备考 — Harry 学习追踪</title>
<style>
:root{
  --bg:#f0f5ff;--bg2:#e8eef8;--card:#fff;--card2:#f8faff;
  --text:#1e293b;--text2:#475569;--text3:#94a3b8;
  --accent:#2563eb;--accent2:#3b82f6;--accent-light:#dbeafe;--accent-dark:#1d4ed8;
  --border:#cbd5e1;--border2:#e2e8f0;
  --green:#16a34a;--green-light:#dcfce7;--red:#dc2626;--red-light:#fee2e2;
  --orange:#ea580c;--orange-light:#fed7aa;--amber:#d97706;--amber-light:#fef3c7;
  --purple:#7c3aed;--purple-light:#e9d5ff;--teal:#0d9488;--teal-light:#ccfbf1;
  --pink:#db2777;--pink-light:#fce7f3;
  --sh:0 1px 3px rgba(0,0,0,.08);--shm:0 4px 16px rgba(0,0,0,.1);--shl:0 8px 32px rgba(0,0,0,.12);
  --nav-h:52px;--tab-h:42px;--max-w:1200px;--r:12px;
}
[data-theme=dark]{
  --bg:#0b1120;--bg2:#111827;--card:#1e293b;--card2:#1a2332;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --accent:#3b82f6;--accent2:#60a5fa;--accent-light:#1e3a5f;--accent-dark:#2563eb;
  --border:#334155;--border2:#1e293b;
  --green:#22c55e;--green-light:#14532d;--red:#ef4444;--red-light:#450a0a;
  --orange:#f97316;--orange-light:#431407;--amber:#f59e0b;--amber-light:#422006;
  --purple:#a855f7;--purple-light:#3b0764;--teal:#14b8a6;--teal-light:#134e4a;
  --pink:#ec4899;--pink-light:#500724;
  --sh:0 1px 3px rgba(0,0,0,.3);--shm:0 4px 16px rgba(0,0,0,.4);--shl:0 8px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6;
  transition:background .3s,color .3s;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.nav{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#1e40af,#2563eb,#3b82f6);color:#fff;box-shadow:0 2px 12px rgba(37,99,235,.3)}
.nav-in{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;max-width:var(--max-w);margin:0 auto}
.nav h1{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.nav h1 .badge{font-size:10px;background:rgba(255,255,255,.2);padding:1px 7px;border-radius:10px;font-weight:400}
.theme-btn{background:rgba(255,255,255,.2);border:none;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.theme-btn:hover{background:rgba(255,255,255,.35)}
.tabs{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:48px;z-index:99;scrollbar-width:none;box-shadow:var(--sh);gap:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:0 14px;height:var(--tab-h);display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--text2);cursor:pointer;border:none;background:transparent;border-bottom:2.5px solid transparent;transition:all .25s;white-space:nowrap;letter-spacing:.2px}
.tab:hover{color:var(--accent);background:var(--accent-light)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-light)}
.tab .ico{font-size:15px}
.main{max-width:var(--max-w);margin:0 auto;padding:0}
.tab-pane{display:none;padding:16px;animation:fadeIn .35s ease}
.tab-pane.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh);border:1px solid var(--border2);transition:all .25s}
.card:hover{box-shadow:var(--shm)}
.card-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title .ico{font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.flex{display:flex;gap:12px;flex-wrap:wrap}
.flex-c{display:flex;flex-direction:column;gap:12px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:var(--r);padding:14px;text-align:center;border:1px solid var(--border2);box-shadow:var(--sh)}
.stat-card .num{font-size:28px;font-weight:800;line-height:1.2}
.stat-card .lbl{font-size:12px;color:var(--text2);margin-top:2px}
.stat-card .sub{font-size:10.5px;color:var(--text3);margin-top:1px}
.tier-group{margin-bottom:12px}
.tier-hdr{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--r);cursor:pointer;font-weight:700;font-size:14px;transition:all .2s;user-select:none;border:1px solid var(--border2)}
.tier-hdr .arrow{transition:transform .3s;font-size:12px}
.tier-hdr.open .arrow{transform:rotate(90deg)}
.tier-hdr .count{font-size:11px;font-weight:400;margin-left:auto;opacity:.7}
.tier-body{padding:8px 0 4px 8px;display:none}
.tier-body.open{display:block}
.concept-item{padding:10px 12px;margin-bottom:6px;border-radius:8px;background:var(--bg2);border:1px solid var(--border2);cursor:pointer;transition:all .2s}
.concept-item:hover{border-color:var(--accent)}
.concept-item .ci-name{font-weight:600;font-size:13px}
.concept-item .ci-def{font-size:12px;color:var(--text2);margin-top:4px;display:none;line-height:1.5}
.concept-item .ci-def.show{display:block}
.concept-item .ci-def .lbl{color:var(--accent);font-weight:600;font-size:11px}
.wrong-item{padding:12px;margin-bottom:8px;border-radius:var(--r);background:var(--card);border:1px solid var(--border2);box-shadow:var(--sh)}
.wrong-item .wi-q{font-size:13px;font-weight:600;margin-bottom:4px}
.wrong-item .wi-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.wrong-item .wi-tag{font-size:10.5px;padding:1px 7px;border-radius:4px;background:var(--red-light);color:var(--red)}
.wrong-item .wi-resp{font-size:12px;color:var(--text2);margin-bottom:2px}
.wrong-item .wi-cause{font-size:11.5px;color:var(--orange);padding:6px 8px;background:var(--orange-light);border-radius:6px;margin-top:4px}
.wrong-item .wi-strat{font-size:11.5px;color:var(--teal);padding:6px 8px;background:var(--teal-light);border-radius:6px;margin-top:4px}
.graph-wrap{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--border2);position:relative;min-height:500px}
.graph-wrap svg{width:100%;height:100%;min-height:500px}
.graph-tip{position:absolute;background:var(--card);color:var(--text);padding:10px 14px;border-radius:8px;box-shadow:var(--shl);border:1px solid var(--border);font-size:12.5px;pointer-events:none;display:none;z-index:10;max-width:300px;line-height:1.5}
.graph-controls{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.kp-group{margin-bottom:10px}
.kp-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:var(--r);cursor:pointer;font-weight:600;background:var(--red-light);border:1px solid rgba(220,38,38,.15);transition:all .2s;font-size:13px}
.kp-hdr .count-badge{background:var(--red);color:#fff;padding:1px 8px;border-radius:10px;font-size:11px}
.kp-body{display:none;padding:8px 0 0 8px}
.kp-body.open{display:block}
.plan-day{padding:12px;margin-bottom:8px;border-radius:var(--r);background:var(--card);border:1px solid var(--border2);border-left:4px solid var(--accent)}
.plan-day.done{border-left-color:var(--green);opacity:.75}
.plan-day .pd-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.plan-day .pd-title{font-weight:700;font-size:14px}
.plan-day .pd-badge{font-size:10.5px;padding:1px 8px;border-radius:8px}
.plan-day .pd-items{font-size:12.5px;color:var(--text2);line-height:1.6}
.plan-day .pd-item{padding:3px 0;display:flex;align-items:baseline;gap:6px}
.plan-day .pd-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.page-card{padding:12px;margin-bottom:8px;border-radius:var(--r);background:var(--card);border:1px solid var(--border2);cursor:pointer;transition:all .2s}
.page-card:hover{border-color:var(--accent)}
.page-card .pc-hdr{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:13px}
.page-card .pc-summary{font-size:12px;color:var(--text2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.page-card .pc-summary.hide{display:none}
.page-card .pc-full{display:none;font-size:12px;color:var(--text2);margin-top:8px;line-height:1.7;background:var(--bg2);padding:10px;border-radius:8px;max-height:400px;overflow-y:auto;white-space:pre-wrap}
.page-card .pc-full.show{display:block}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;border:none;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark);box-shadow:0 2px 8px rgba(37,99,235,.3)}
.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn-outline:hover{background:var(--accent-light)}
.btn-sm{padding:4px 10px;font-size:11px}
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut{width:120px;height:120px;border-radius:50%;position:relative;background:var(--border2);flex-shrink:0}
.donut-seg{position:absolute;width:100%;height:100%;border-radius:50%}
.donut-seg.half{clip:rect(0,120px,120px,60px)}
.donut-seg.cover{clip:rect(0,60px,120px,0)}
.donut-hole{position:absolute;width:84px;height:84px;background:var(--card);border-radius:50%;top:18px;left:18px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.donut-hole .val{font-size:22px;font-weight:800;line-height:1}
.donut-hole .lbl{font-size:10px;color:var(--text3)}
.donut-legend{font-size:12px;display:flex;flex-direction:column;gap:4px}
.donut-legend .dl-item{display:flex;align-items:center;gap:6px}
.donut-legend .dl-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px}
.empty .ico{font-size:40px;margin-bottom:8px;display:block}
.bar-chart{margin:8px 0}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.bar-row .bar-lbl{font-size:11.5px;flex:0 0 120px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bar-track{flex:1;height:14px;background:var(--border2);border-radius:7px;overflow:hidden}
.bar-row .bar-fill{height:100%;border-radius:7px;transition:width 1s ease;min-width:2px}
.bar-row .bar-val{font-size:11px;flex:0 0 30px;color:var(--text2)}
.dot-core-bg{background:var(--red-light);border-left:3px solid var(--red)}
.dot-common-bg{background:var(--accent-light);border-left:3px solid var(--accent)}
.dot-error-bg{background:var(--orange-light);border-left:3px solid var(--orange)}
.dot-edge-bg{background:var(--bg2);border-left:3px solid var(--text3)}
.anim-count{animation:countUp .4s ease}
@keyframes countUp{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@media(max-width:480px){
  .nav h1{font-size:14px}.nav h1 .badge{display:none}
  .tab{padding:0 10px;font-size:11px}.tab .ico{font-size:13px}
  .tab-pane{padding:10px}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .stat-card{padding:10px}.stat-card .num{font-size:22px}
  .wrong-item{padding:10px}
  .graph-wrap{min-height:320px}.graph-wrap svg{min-height:320px}
  .donut{width:90px;height:90px}.donut-seg.half{clip:rect(0,90px,90px,45px)}
  .donut-seg.cover{clip:rect(0,45px,90px,0)}
  .donut-hole{width:64px;height:64px;top:13px;left:13px}
  .donut-hole .val{font-size:18px}
  .bar-row .bar-lbl{flex:0 0 80px;font-size:10.5px}
  .card{padding:12px}
  .grid2{gap:8px}
  .flex{gap:8px} .flex-c{gap:8px}
  .btn{padding:6px 10px;font-size:11.5px}
  #testOverlay{padding:10px}
  .paper-question{padding:8px 0!important}
  .paper-opt{padding:6px 10px!important;font-size:12px!important}
  .plan-day{padding:10px}
  .tier-hdr{padding:8px 10px;font-size:13px}
  .concept-item{padding:8px 10px}
  /* Test result screen on mobile */
  #testResultContent .donut-wrap{gap:10px}
  #testResultContent .wrong-item{padding:8px}
}
@media(max-width:768px){
  .stat-row{grid-template-columns:repeat(3,1fr)}
  .grid2{gap:10px}
  .donut{width:100px;height:100px}
  .donut-seg.half{clip:rect(0,100px,100px,50px)}
  .donut-seg.cover{clip:rect(0,50px,100px,0)}
  .donut-hole{width:70px;height:70px;top:15px;left:15px}
  .graph-wrap{min-height:380px}.graph-wrap svg{min-height:380px}
}
@media print{.nav,.tabs,.theme-btn,.graph-controls,.btn{display:none!important}.tab-pane{display:block!important}}
</style>
</head>
<body>
<nav class=nav>
<div class=nav-in>
<h1>🔬 科学备考 <span class=badge>Harry · 六年级</span></h1>
<div style=display:flex;gap:8px;align-items:center>
<span id=themeLabel style=font-size:11px;opacity:.7>🌙</span>
<button class=theme-btn onclick=toggleTheme() aria-label=主题>🌓</button>
</div>
</div>
</nav>
<div class=tabs id=tabs>
<button class="tab active" data-tab=0><span class=ico>📊</span> 总览</button>
<button class=tab data-tab=1><span class=ico>🧠</span> 知识图谱</button>
<button class=tab data-tab=2><span class=ico>❌</span> 错题诊疗</button>
<button class=tab data-tab=3><span class=ico>🔮</span> 概念网络</button>
<button class=tab data-tab=4><span class=ico>📋</span> 学习清单</button>
<button class=tab data-tab=5><span class=ico>📖</span> 教材溯源</button>
</div>
<div class=main>

<!-- TAB 0: DASHBOARD -->
<div class="tab-pane active" id=pane0>
<div class=stat-row id=statRow></div>
<div class=grid2>
<div class=card><div class=card-title><span class=ico>🎯</span> 掌握率</div><div id=masteryDonut class=donut-wrap></div></div>
<div class=card><div class=card-title><span class=ico>📈</span> 概念分布</div><div id=conceptDistChart></div></div>
</div>
<div class=grid2 style=margin-top:12px>
<div class=card><div class=card-title><span class=ico>⚠️</span> 薄弱知识点 TOP10</div><div id=weakKpChart></div></div>
<div class=card><div class=card-title><span class=ico>🏆</span> 学习建议</div><div id=dashAdvice></div></div>
</div>
<div id=testRecordsArea></div>
</div>

<!-- TAB 1: KNOWLEDGE MAP -->
<div class=tab-pane id=pane1>
<div class=card style=margin-bottom:12px>
<div class=flex style=align-items:center;gap:8px;margin-bottom:8px>
<input type=text id=conceptSearch placeholder="🔍 搜索概念..." style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);color:var(--text);outline:none" oninput=filterConcepts()>
<select id=conceptFilter onchange=filterConcepts() style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);color:var(--text);outline:none">
<option value=all>全部</option>
<option value=核心概念>⭐ 核心概念</option>
<option value=常考概念>📘 常考概念</option>
<option value=易错概念>⚠️ 易错概念</option>
<option value=边缘概念>🌱 边缘概念</option>
</select>
</div>
<div id=conceptCountBar style=font-size:12px;color:var(--text3);margin-bottom:8px></div>
</div>
<div id=conceptMapContainer></div>
</div>

<!-- TAB 2: WRONG CLINIC -->
<div class=tab-pane id=pane2>
<div class=card style=margin-bottom:12px>
<div class=flex style=align-items:center;gap:8px>
<input type=text id=wrongSearch placeholder="🔍 搜索错题..." style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);color:var(--text);outline:none" oninput=filterWrongs()>
<select id=wrongSort onchange=renderWrongClinic() style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);color:var(--text);outline:none">
<option value=kp>按知识点分组</option>
<option value=all>全部列表</option>
</select>
<button class="btn btn-primary" onclick=startOnlineTest() style="white-space:nowrap">📝 在线测试</button>
<button class="btn btn-outline" onclick=exportWrongPrint() style="white-space:nowrap">🖨️ 导出错题</button>
<button class="btn btn-outline" onclick=exportWrongWord() style="white-space:nowrap">📄 导出Word</button>
</div>
<div style=font-size:12px;color:var(--text3);margin-top:6px>共 <strong id=wrongCount></strong> 道错题，<strong id=wrongKpCount></strong> 个知识点</div>
</div>
<div id=wrongClinicContainer></div>
</div>

<!-- TAB 3: KNOWLEDGE GRAPH -->
<div class=tab-pane id=pane3>
<div class=graph-controls>
<button class="btn btn-sm btn-outline" onclick=resetGraphView()>🔄 重置</button>
<select id=graphFilter onchange=filterGraph() style="padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px;background:var(--card);color:var(--text);outline:none">
<option value=all>全部概念</option>
<option value=核心概念>⭐ 核心概念</option>
<option value=常考概念>📘 常考概念</option>
<option value=易错概念>⚠️ 易错概念</option>
<option value=边缘概念>🌱 边缘概念</option>
</select>
<span style=display:flex;gap:10px;flex-wrap:wrap;align-items:center>
<span id=graphLegend style="font-size:11px;color:var(--text3);display:flex;gap:10px;flex-wrap:wrap;align-items:center">
<span>📌 图例：</span>
<span style="display:inline-flex;align-items:center;gap:3px"><span style=width:14px;height:2px;background:var(--blue,#3b82f6);display:inline-block></span>包含</span>
<span style="display:inline-flex;align-items:center;gap:3px"><span style=width:14px;height:2px;background:var(--orange);display:inline-block></span>依赖</span>
<span style="display:inline-flex;align-items:center;gap:3px"><span style=width:14px;height:2px;background:var(--green);display:inline-block></span>并列</span>
<span style="display:inline-flex;align-items:center;gap:3px"><span style=width:14px;height:2px;background:var(--accent);display:inline-block></span>同知识点</span>
</span>
<span style=font-size:12px;color:var(--text3)>拖动节点 · 滚轮缩放</span>
<span style=font-size:12px;color:var(--text3)>共 <span id=relationCount></span> 条概念关系</span>
</span>
</div>
<div class=graph-wrap id=graphWrap>
<svg id=graphSvg></svg>
<div class=graph-tip id=graphTip></div>
</div>
</div>

<!-- TAB 4: STUDY PLAN (清单模式) -->
<div class=tab-pane id=pane4>
<div class=card style=margin-bottom:12px>
<div style=display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px>
<div><span class=ico>📋</span> <strong>薄弱知识点清单</strong><span style=font-size:12px;color:var(--text3);margin-left:8px>勾选已掌握项 · 点击「开始学习」进入在线测试</span></div>
<button class="btn btn-sm btn-primary" onclick=generatePlan()>🔄 刷新</button>
</div>
</div>
<div id=planContainer></div>
</div>

<!-- TAB 5: TEXTBOOK SOURCE -->
<div class=tab-pane id=pane5>
<div class=card style=margin-bottom:12px>
<div class=flex style=align-items:center;gap:8px>
<input type=text id=pageSearch placeholder="🔍 搜索教材内容..." style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);color:var(--text);outline:none" oninput=filterPages()>
<select id=pageSort onchange=renderPages() style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);color:var(--text);outline:none">

</div>
</div>

<!-- ONLINE TEST MODAL / OVERLAY -->

<div style=display:flex;align-items:center;justify-content:space-between>
<span style=font-weight:700;font-size:15px>📝 在线测试</span>

<!-- Mode Selection Screen -->
<div id=testModeScreen style="padding:24px">
<div style=text-align:center;margin-bottom:20px>
<div style=font-size:36px>📝</div>
<div style=font-size:18px;font-weight:700;margin-top:8px>在线测试</div>

<span style=font-size:28px>📚</span>
<div><div style=font-weight:700;color:var(--text)>知识点专练</div><div style=font-size:11px;color:var(--text3);margin-top:2px>按选择的知识点，从该知识点错题中抽题</div></div>
</button>
<button class="mode-btn" data-mode=mock onclick="selectTestMode('mock')" style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);border:2px solid var(--border);background:var(--card);cursor:pointer;transition:all .2s;text-align:left;font-size:13px">
<span style=font-size:28px>🧪</span>
<div><div style=font-weight:700;color:var(--text)>模拟测试</div><div style=font-size:11px;color:var(--text3);margin-top:2px>从全部题库随机抽题，含已掌握的题目</div></div>
</button>
</div>
<div style=margin-top:16px;display:flex;align-items:center;gap:12px;justify-content:center>
<span style=font-size:12px;color:var(--text2)>题数：</span>
<div style=display:flex;gap:6px;flex-wrap:wrap id=questionCountOptions>
<button class="qty-btn selected" data-qty=10 onclick="selectQty(10)" style="padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer">10题</button>
<button class=qty-btn data-qty=5 onclick="selectQty(5)" style="padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;cursor:pointer">5题</button>
<button class=qty-btn data-qty=15 onclick="selectQty(15)" style="padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;cursor:pointer">15题</button>
<button class=qty-btn data-qty=20 onclick="selectQty(20)" style="padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;cursor:pointer">20题</button>

</div>

<div id=testResultContent></div>

<script src=data.js></script>
<script>
(function(){
const _Q = BAOKE_DATA.questions;
const _C = BAOKE_DATA.concepts;
const _P = BAOKE_DATA.source_pages;
const _S = BAOKE_DATA.stats;
const _ST = BAOKE_DATA.student;
const _CR = BAOKE_DATA.course;
const wrongQ = _Q.filter(q => q.is_correct === '✗');
const correctQ = _Q.filter(q => q.is_correct === '✓');
const tierOrder = ['核心概念','常考概念','易错概念','边缘概念'];
const tierColors = {'核心概念':'var(--red)','常考概念':'var(--accent)','易错概念':'var(--orange)','边缘概念':'var(--text3)'};
const conceptMap = {}; _C.forEach(c => conceptMap[c.id] = c);
function $(id){return document.getElementById(id)}
function esc(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function limitStr(s,n){return s&&s.length>n?s.slice(0,n)+'…':s||'';}

/* THEME */
function toggleTheme(){
  const d = document.documentElement;
  const isDark = d.getAttribute('data-theme') === 'dark';
  d.setAttribute('data-theme', isDark ? '' : 'dark');
  $('themeLabel').textContent = isDark ? '🌙' : '☀️';
  localStorage.setItem('baoke-theme', isDark ? 'light' : 'dark');
}
(function(){
  const saved = localStorage.getItem('baoke-theme');
  if(saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme:dark)').matches)){
    document.documentElement.setAttribute('data-theme','dark');
    $('themeLabel').textContent = '☀️';
  }
})();

/* TABS */
(function(){
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(t => t.addEventListener('click', function(){
    tabs.forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(x => x.classList.remove('active'));
    this.classList.add('active');
    $('pane'+this.dataset.tab).classList.add('active');
    if(Number(this.dataset.tab) === 3) setTimeout(runGraph,100);
  }));
})();

/* === DASHBOARD === */
(function renderDashboard(){
  const wk=wrongQ.length, ck=correctQ.length, pct=(ck/_Q.length*100).toFixed(1);
  $('statRow').innerHTML = `
    <div class=stat-card><div class=num style=color:var(--accent)>${_Q.length}</div><div class=lbl>总题数</div></div>
    <div class=stat-card><div class=num style=color:var(--green)>${ck}</div><div class=lbl>做对</div><div class=sub>${pct}%</div></div>
    <div class=stat-card><div class=num style=color:var(--red)>${wk}</div><div class=lbl>做错</div><div class=sub>${(wk/_Q.length*100).toFixed(1)}%</div></div>
    <div class=stat-card><div class=num style=color:var(--purple)>${_C.length}</div><div class=lbl>概念数</div><div class=sub>${_P.length}页教材</div></div>
    <div class=stat-card><div class=num style=color:var(--amber)>${_CR.target_score||'--'}</div><div class=lbl>目标分</div><div class=sub>${_ST.name} · ${_ST.school}</div></div>`;
  const angle=ck/_Q.length*360;
  $('masteryDonut').innerHTML = `
    <div class=donut>
      <div class="donut-seg half" style="transform:rotate(${-90+Math.min(angle,180)}deg);background:var(--green)"></div>
      ${angle>180?`<div class="donut-seg cover" style=background:var(--border2)></div>
      <div class="donut-seg cover" style="transform:rotate(${-90+(angle-180)}deg);background:var(--green)"></div>`:`<div class="donut-seg cover" style="transform:rotate(${-90+angle}deg);background:var(--border2)"></div>`}
      <div class=donut-hole><div class=val style=color:var(--green)>${pct}%</div><div class=lbl>正确率</div></div>
    </div>
    <div class=donut-legend><div class=dl-item><div class=dl-dot style=background:var(--green)></div>正确 ${ck} 题</div><div class=dl-item><div class=dl-dot style=background:var(--border2)></div>错误 ${wk} 题</div></div>`;
  const tierCounts={};_C.forEach(c=>{tierCounts[c.type_name]=(tierCounts[c.type_name]||0)+1;});
  const totalC=_C.length;
  $('conceptDistChart').innerHTML = `<div class=bar-chart>${
    tierOrder.map(t=>`<div class=bar-row><div class=bar-lbl>${t}</div><div class=bar-track><div class=bar-fill style="width:${((tierCounts[t]||0)/totalC*100).toFixed(1)}%;background:${tierColors[t]}"></div></div><div class=bar-val>${tierCounts[t]||0}</div></div>`).join('')
  }</div>`;
  const kpErr={};wrongQ.forEach(q=>{const kp=q.knowledge_point||'未知';if(!kpErr[kp])kpErr[kp]={count:0,causes:[]};kpErr[kp].count++;if(q.error_cause&&!kpErr[kp].causes.includes(q.error_cause))kpErr[kp].causes.push(q.error_cause);});
  const topKp=Object.entries(kpErr).sort((a,b)=>b[1].count-a[1].count).slice(0,10);
  const maxCnt=topKp.length?topKp[0][1].count:1;
  $('weakKpChart').innerHTML=topKp.length?`<div class=bar-chart>${
    topKp.map(([kp,v])=>`<div class=bar-row><div class=bar-lbl title="${esc(kp)}">${kp}</div><div class=bar-track><div class=bar-fill style="width:${(v.count/maxCnt*100).toFixed(0)}%;background:var(--orange)"></div></div><div class=bar-val>×${v.count}</div></div>`).join('')
  }</div>`:'<div class=empty><span class=ico>🎉</span>暂无错题数据</div>';
  const advice=[];if(wk>0)advice.push(`📌 共有 <strong>${wk}</strong> 道错题需要回顾，重点集中在 <strong>${topKp.slice(0,3).map(([k])=>k).join('、')}</strong> 等知识点。`);
  advice.push(`📖 已掌握 <strong>${_C.length}</strong> 个概念，其中 <strong>${tierCounts['核心概念']||0}</strong> 个核心概念。`);
  if(wk>0)advice.push(`⏱️ 建议每天安排 30 分钟专攻 1-2 个易错知识点，配合教材溯源加深理解。`);
  advice.push(`🏁 当前正确率 <strong>${pct}%</strong>，距目标 ${_CR.target_score}% ${pct>=_CR.target_score?'✅ 已达到！':`还有 ${(_CR.target_score-parseFloat(pct)).toFixed(1)}% 的提升空间`}。`);
  $('dashAdvice').innerHTML=`<div class=flex-c>${advice.map(a=>`<div style="padding:6px 0;font-size:13px;line-height:1.6">${a}</div>`).join('')}</div>`;
  // Render recent test records
  renderTestRecords();
})();
// Helper: render test records from localStorage
function renderTestRecords(){
  const container=$('testRecordsArea');
  if(!container)return;
  let results=[];
  try{
    const saved=localStorage.getItem('baoke-test-results');
    if(saved)results=JSON.parse(saved);
  }catch(e){}
  if(!results.length){
    container.innerHTML='<div class=empty style=padding:20px><span class=ico>📝</span>暂无测试记录<br><span style=font-size:12px;color:var(--text3)>完成在线测试后，结果会自动显示在此处</span></div>';
    return;
  }
  // Show last 10 results, most recent first
  const recent=[...results].reverse().slice(0,10);
  const last5=[...results].slice(-5);
  const pcts=last5.map(r=>r.total>0?(r.correct/r.total*100).toFixed(0):'0');
  // Count repeated wrong KPs
  const kpCounts={};
  results.forEach(r=>{
    if(r.wrong_kps)r.wrong_kps.forEach(kp=>{kpCounts[kp]=(kpCounts[kp]||0)+1;});
  });
  const repeatedKps=Object.entries(kpCounts).filter(([,c])=>c>=2).sort((a,b)=>b[1]-a[1]).slice(0,5);
  // Bar chart for trend
  const maxPct=Math.max(...pcts.map(Number),100);
  let barHtml='';
  if(pcts.length>=2){
    const barColors=pcts.map(p=>Number(p)>=60?'var(--green)':'var(--orange)');
    barHtml='<div style=display:flex;align-items:end;gap:6px;height:50px;padding:4px 0>'+
      pcts.map((p,i)=>'<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px"><div style="width:100%;height:'+(Number(p)/maxPct*40)+'px;background:'+barColors[i]+';border-radius:3px 3px 0 0;min-height:4px;transition:all .3s"></div><span style=font-size:9px;color:var(--text3)>'+p+'%</span></div>').join('')+
      '</div>';
  }
  let html='<div class=card style=margin-top:12px>'
    +'<div class=card-title><span class=ico>📊</span> 最近测试记录</div>'
    +'<div class=flex-c style=gap:4px>';
  recent.forEach((r,i)=>{
    const pct=r.total>0?(r.correct/r.total*100).toFixed(0):'0';
    const date=new Date(r.date);
    const timeStr=date.toLocaleDateString('zh-CN',{month:'short',day:'numeric'})+' '+date.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    const icon=r.correct/r.total>=0.7?'✅':'❌';
    html+='<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;background:var(--bg2);font-size:12px">'
      +'<span style="flex:0 0 auto">'+icon+'</span>'
      +'<span style="flex:0 0 auto;color:var(--text3);font-size:11px">'+timeStr+'</span>'
      +'<span style="flex:0 0 auto;padding:1px 6px;border-radius:4px;background:var(--accent-light);color:var(--accent);font-size:10.5px">'+r.modeLabel+'</span>'
      +'<span style="flex:0 0 auto">'+r.correct+'/'+r.total+'</span>'
      +'<span style="font-weight:600;font-size:12px;color:'+(Number(pct)>=70?'var(--green)':'var(--orange)')+'">'+pct+'%</span>'
      +'</div>';
  });
  html+='</div>';
  // Trend mini bar chart
  if(barHtml){
    html+='<div style=margin-top:8px><div style=font-size:12px;color:var(--text2);margin-bottom:4px>近期趋势（最近5次测试）：</div>'+barHtml+'</div>';
  }
  // Repeated wrong KPs
  if(repeatedKps.length){
    html+='<div style=margin-top:8px><div style=font-size:12px;color:var(--orange);margin-bottom:4px>🔄 反复错知识点：</div>'
      +'<div style=display:flex;flex-wrap:wrap;gap:4px>'+
      repeatedKps.map(([kp,c])=>'<span style="font-size:11px;padding:2px 8px;border-radius:4px;background:var(--red-light);color:var(--red)">'+esc(kp)+' ×'+c+'</span>').join('')
      +'</div></div>';
  }
  html+='</div>';
  container.innerHTML=html;
}

/* === KNOWLEDGE MAP === */
function filterConcepts(){renderConceptMap($('conceptSearch').value.trim().toLowerCase(),$('conceptFilter').value);}
function renderConceptMap(search='',filter='all'){
  let concepts=_C;if(filter!=='all')concepts=concepts.filter(c=>c.type_name===filter);
  if(search)concepts=concepts.filter(c=>c.name.toLowerCase().includes(search)||(c.definition||'').toLowerCase().includes(search));
  const grouped={};tierOrder.forEach(t=>grouped[t]=[]);concepts.forEach(c=>{if(grouped[c.type_name])grouped[c.type_name].push(c);});
  $('conceptCountBar').textContent=search||filter!=='all'?`显示 ${concepts.length}/${_C.length} 个概念`:`共 ${_C.length} 个概念`;
  const container=$('conceptMapContainer');
  if(!concepts.length){container.innerHTML='<div class=empty><span class=ico>🔍</span>未找到匹配概念</div>';return;}
  const dotBg={'核心概念':'dot-core-bg','常考概念':'dot-common-bg','易错概念':'dot-error-bg','边缘概念':'dot-edge-bg'};
  container.innerHTML=tierOrder.map(t=>{
    const items=grouped[t]||[];if(!items.length)return '';
    return `<div class=tier-group>
      <div class="tier-hdr ${dotBg[t]} open" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">
        <span class=arrow>▶</span><span style=color:${tierColors[t]}>●</span> ${t} <span class=count>${items.length} 个</span>
      </div>
      <div class="tier-body open">${items.map(c=>{
        const defShow=c.definition?'show':'';
        return `<div class=concept-item onclick="this.querySelector('.ci-def')?.classList.toggle('show')">
          <div class=ci-name>${esc(c.name)}</div>
          <div class="ci-def ${defShow}">
            ${c.definition?`<div><span class=lbl>定义：</span>${esc(c.definition)}</div>`:''}
            ${c.analogy?`<div style=margin-top:4px>🧩 ${esc(c.analogy)}</div>`:''}
            ${c.example?`<div style=margin-top:4px>📝 ${esc(c.example)}</div>`:''}
            ${c.counter_example?`<div style=margin-top:4px;color:var(--red)><span class=lbl>反例：</span>${esc(c.counter_example)}</div>`:''}
          </div>
        </div>`;
      }).join('')}</div></div>`;
  }).join('');
}
renderConceptMap();

/* === WRONG CLINIC === */
function renderWrongClinic(){
  const sort=$('wrongSort').value,q=($('wrongSearch').value||'').trim().toLowerCase();
  let items=wrongQ;if(q)items=items.filter(w=>(w.knowledge_point||'').toLowerCase().includes(q)||(w.question_text||'').toLowerCase().includes(q)||(w.error_cause||'').toLowerCase().includes(q));
  $('wrongCount').textContent=items.length;$('wrongKpCount').textContent=new Set(items.map(w=>w.knowledge_point)).size;
  const container=$('wrongClinicContainer');
  if(!items.length){container.innerHTML='<div class=empty><span class=ico>🎉</span>没有匹配的错题</div>';return;}
  if(sort==='all'){container.innerHTML=items.map(w=>wi(w)).join('');return;}
  const grouped={};items.forEach(w=>{const kp=w.knowledge_point||'未分类';if(!grouped[kp])grouped[kp]=[];grouped[kp].push(w);});
  const sortedKps=Object.entries(grouped).sort((a,b)=>b[1].length-a[1].length);
  container.innerHTML=sortedKps.map(([kp,ws])=>`<div class=kp-group>
    <div class=kp-hdr onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">
      <span>${kp} <span class=count-badge>${ws.length}题</span></span>
      <span style=font-size:11px;color:var(--text3)>${ws[0].error_cause?'有归因分析 📋':'点击展开 ▶'}</span>
    </div>
    <div class=kp-body>${ws.map(w=>wi(w)).join('')}</div></div>`
  ).join('');
  setTimeout(()=>{const h=container.querySelectorAll('.kp-hdr');h.forEach((h,i)=>{if(i<3&&h.closest('.kp-group').querySelector('.wrong-item')){h.classList.add('open');h.nextElementSibling.classList.add('open');}});},50);
}
function wi(w){const c=w.error_cause||'',d=w.error_detail||'',s=w.exam_strategy||'';
  return `<div class=wrong-item>
    <div class=wi-q>${w.question_number?`<span style=color:var(--text3);font-weight:400;font-size:12px>${esc(w.question_number)}. </span>`:''}${esc(w.question_text||'')}</div>
    <div class=wi-meta><span class=wi-tag>✗ ${esc(w.knowledge_point||'未分类')}</span>${w.difficulty?`<span style=font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--bg2);color:var(--text2)>难度${w.difficulty}</span>`:''}</div>
    ${w.student_response?`<div class=wi-resp><strong>作答：</strong>${esc(limitStr(w.student_response,120))}</div>`:''}
    ${c?`<div class=wi-cause><strong>归因：</strong>${esc(c)}</div>`:''}
    ${d?`<div class=wi-cause style="background:var(--amber-light);color:var(--amber);margin-top:3px"><strong>详解：</strong>${esc(d)}</div>`:''}
    ${s?`<div class=wi-strat><strong>策略：</strong>${esc(s)}</div>`:''}
  </div>`;
}
function filterWrongs(){renderWrongClinic();}
renderWrongClinic();

/* === EXPORT WRONG ANSWERS === */

/* === KNOWLEDGE GRAPH === */
let graphNodes=[],graphEdges=[],graphTransform={x:0,y:0,scale:1};
function buildGraphData(filter='all'){
  console.log('DEBUG buildGraphData called, filter:', filter, 'total concepts:', _C.length, 'relations:', BAOKE_DATA.relations?.length);
  let concepts=_C;if(filter!=='all')concepts=concepts.filter(c=>c.type_name===filter);
  console.log('DEBUG buildGraphData filtered concepts:', concepts.length);
  graphNodes=concepts.map((c,i)=>({id:c.id,name:c.name,type:c.type_name,priority:c.priority,x:200+Math.random()*600,y:150+Math.random()*400,vx:0,vy:0,r:c.priority===1?10:c.priority===2?8:c.priority===3?7:6}));
  // Update relation count display
  const rcEl=$('relationCount');if(rcEl)rcEl.textContent=(BAOKE_DATA.relations?.length||0)+'';
  const kpConcepts={};
  _Q.forEach(q=>{if(q.knowledge_point&&q.concept_id){if(!kpConcepts[q.knowledge_point])kpConcepts[q.knowledge_point]=new Set();kpConcepts[q.knowledge_point].add(q.concept_id);}});
  const edgeSet=new Set();graphEdges=[];
  // Edges from shared knowledge_point (existing logic)
  Object.values(kpConcepts).forEach(conIds=>{
    const arr=[...conIds].filter(id=>graphNodes.some(n=>n.id===id));
    for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){const key=Math.min(arr[i],arr[j])+'-'+Math.max(arr[i],arr[j]);if(!edgeSet.has(key)){edgeSet.add(key);graphEdges.push({source:arr[i],target:arr[j],weight:1,type:'kp'});}else{const e=graphEdges.find(e=>e.source===Math.min(arr[i],arr[j])&&e.target===Math.max(arr[i],arr[j]));if(e)e.weight++;}}
  });
  const nodeIds=new Set(graphNodes.map(n=>n.id));
  graphEdges=graphEdges.filter(e=>nodeIds.has(e.source)&&nodeIds.has(e.target));
  graphEdges.sort((a,b)=>b.weight-a.weight);
  graphEdges=graphEdges.slice(0,Math.max(graphNodes.length*2,50));
  // Semantic edges from BAOKE_DATA.relations
  const nameToId={};_C.forEach(c=>nameToId[c.name]=c.id);
  if(BAOKE_DATA.relations && BAOKE_DATA.relations.length){
    const relColors={'依赖':'var(--orange)','包含':'var(--blue, #3b82f6)','并列':'var(--green)'};
    BAOKE_DATA.relations.forEach(r=>{
      const sId=nameToId[r.source];
      const tId=nameToId[r.target];
      if(!sId||!tId)return;
      if(!nodeIds.has(sId)||!nodeIds.has(tId))return;
      const key=Math.min(sId,tId)+'-'+Math.max(sId,tId);
      const relation=r.relation||'并列';
      if(!edgeSet.has(key)){
        edgeSet.add(key);
        graphEdges.push({source:sId,target:tId,weight:1,type:'semantic',relation:relation,color:relColors[relation]||'var(--accent)'});
      }else{
        // Update existing edge to include relation info
        const e=graphEdges.find(e=>e.source===Math.min(sId,tId)&&e.target===Math.max(sId,tId));
        if(e && !e.relation){
          e.relation=relation;
          e.color=relColors[relation]||'var(--accent)';
          e.weight=Math.min(e.weight+0.5,5);
        }
      }
    });
  }
}
function runForceLayout(iterations=200){
  const nodes=graphNodes,edges=graphEdges,cx=500,cy=400,repulsion=800000,attraction=0.003,damping=0.85,centerForce=0.002;
  const typeRadii={'核心概念':80,'常考概念':180,'易错概念':280,'边缘概念':360};
  nodes.forEach((n,i)=>{const radius=typeRadii[n.type]||200;const angle=(i/nodes.length)*Math.PI*2+Math.random()*0.1;n.x=cx+Math.cos(angle)*radius*(0.8+Math.random()*0.4);n.y=cy+Math.sin(angle)*radius*(0.8+Math.random()*0.4);});
  for(let iter=0;iter<iterations;iter++){const k=1-iter/iterations;
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){let dx=nodes[j].x-nodes[i].x,dy=nodes[j].y-nodes[i].y,dist=Math.sqrt(dx*dx+dy*dy)||1;let force=repulsion/(dist*dist)*k,fx=dx/dist*force,fy=dy/dist*force;nodes[i].vx-=fx;nodes[i].vy-=fy;nodes[j].vx+=fx;nodes[j].vy+=fy;}
    for(const e of edges){const si=nodes.findIndex(n=>n.id===e.source),ti=nodes.findIndex(n=>n.id===e.target);if(si===-1||ti===-1)continue;const dx=nodes[ti].x-nodes[si].x,dy=nodes[ti].y-nodes[si].y,dist=Math.sqrt(dx*dx+dy*dy)||1;const ideal=80+(e.weight||1)*10,f=(dist-ideal)*attraction*k;nodes[si].vx+=dx/dist*f;nodes[si].vy+=dy/dist*f;nodes[ti].vx-=dx/dist*f;nodes[ti].vy-=dy/dist*f;}
    for(const n of nodes){n.vx+=(cx-n.x)*centerForce*k;n.vy+=(cy-n.y)*centerForce*k;n.vx*=damping;n.vy*=damping;n.x+=n.vx;n.y+=n.vy;}
  }
}
function renderGraph(){
  console.log('DEBUG renderGraph called, nodes:', graphNodes.length, 'edges:', graphEdges.length);
  const svg=$('graphSvg'),wrap=$('graphWrap'),w=wrap.clientWidth||1000,h=Math.max(wrap.clientHeight||600,500);
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  const nodeMap={};graphNodes.forEach(n=>nodeMap[n.id]=n);
  const maxWeight=Math.max(...graphEdges.map(e=>e.weight),1);
  let html='<g transform="translate('+graphTransform.x+','+graphTransform.y+') scale('+graphTransform.scale+')">';
  for(const e of graphEdges){const s=nodeMap[e.source],t=nodeMap[e.target];if(!s||!t)continue;const op=0.15+(e.weight/maxWeight)*0.4;const strokeColor=e.color||'var(--accent)';html+='<line x1="'+s.x+' y1="'+s.y+' x2="'+t.x+' y2="'+t.y+' stroke="'+strokeColor+'" stroke-opacity="'+op+'" stroke-width="'+(0.5+e.weight/maxWeight*1.5)+'"/>';}
  // Legend for relation types
  const legendEdges=graphEdges.filter(e=>e.type==='semantic');
  for(const n of graphNodes){const color=tierColors[n.type]||'var(--text3)';html+='<g class=gn data-id="'+n.id+'" transform="translate('+n.x.toFixed(1)+','+n.y.toFixed(1)+')" style=cursor:pointer><circle r="'+n.r+'" fill="'+color+'" stroke="#fff" stroke-width="1.5" opacity=".85"><title>'+esc(n.name)+'</title></circle><text y="'+(n.r+12)+'" text-anchor="middle" font-size="'+(n.r>8?9:7)+'" fill="var(--text)" font-weight="600" style="text-shadow:0 0 2px var(--card)">'+(n.name.length>6?n.name.slice(0,5)+'…':n.name)+'</text></g>';}
  html+='</g>';svg.innerHTML=html;
  svg.querySelectorAll('.gn').forEach(g=>{g.addEventListener('mouseenter',e=>{const id=parseInt(g.dataset.id);const n=graphNodes.find(nd=>nd.id===id);const c=_C.find(cc=>cc.id===id);if(!n)return;const tip=$('graphTip');tip.innerHTML='<strong>'+esc(n.name)+'</strong><br><span style=font-size:11px;color:'+tierColors[n.type]+'>'+n.type+'</span>'+(c&&c.definition?'<br><span style=font-size:11px>'+esc(c.definition.slice(0,120))+'</span>':'');tip.style.display='block';const rect=wrap.getBoundingClientRect();let x=e.clientX-rect.left+12,y=e.clientY-rect.top+12;if(x+200>rect.width)x=e.clientX-rect.left-200;if(y+100>rect.height)y=e.clientY-rect.top-80;tip.style.left=x+'px';tip.style.top=y+'px';});g.addEventListener('mouseleave',()=>{$('graphTip').style.display='none';});});
  let dragNode=null,dragOff={x:0,y:0};
  function pos(e){const rect=svg.getBoundingClientRect();return{x:(e.clientX-rect.left-graphTransform.x)/graphTransform.scale,y:(e.clientY-rect.top-graphTransform.y)/graphTransform.scale};}
  function findNode(x,y){for(let i=graphNodes.length-1;i>=0;i--){const n=graphNodes[i];if((x-n.x)**2+(y-n.y)**2<(n.r+5)**2)return n;}return null;}
  svg.onpointerdown=e=>{const p=pos(e),n=findNode(p.x,p.y);if(n){dragNode=n;dragOff={x:p.x-n.x,y:p.y-n.y};svg.setPointerCapture(e.pointerId);e.preventDefault();}};
  svg.onpointermove=e=>{if(dragNode){const p=pos(e);dragNode.x=p.x-dragOff.x;dragNode.y=p.y-dragOff.y;renderGraph();}};
  svg.onpointerup=()=>{dragNode=null;};
  svg.onwheel=e=>{e.preventDefault();const d=e.deltaY>0?.9:1.1;graphTransform.scale=Math.min(Math.max(graphTransform.scale*d,.1),5);const rect=svg.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;graphTransform.x=mx-(mx-graphTransform.x)*d;graphTransform.y=my-(my-graphTransform.y)*d;renderGraph();};
}
function resetGraphView(){graphTransform={x:0,y:0,scale:1};setTimeout(filterGraph,50);}
function filterGraph(){buildGraphData($('graphFilter').value);runForceLayout(150);renderGraph();}
function runGraph(){
  console.log('DEBUG runGraph called, graphNodes.length:', graphNodes.length);
  const wrap=$('graphWrap');
  if(wrap && wrap.clientWidth === 0){console.log('DEBUG runGraph: wrap has 0 width, setting default 1000x600');}
  if(!graphNodes.length)filterGraph();
}

function saveTestResult(result){
  let results = [];

    const saved = localStorage.getItem('baoke-test-results');
    if(saved) results = JSON.parse(saved);
  }catch(e){}
  results.push(result);
  // Keep only last 50 results

  localStorage.setItem('baoke-test-results', JSON.stringify(results));

// Priority helper
function getPriorityLabel(score,errors,typeName){
  if(errors>=5||typeName==='核心概念')return{label:'🔴高',color:'var(--red)',level:3};
  if(errors>=3||typeName==='常考概念')return{label:'🟡中',color:'var(--orange)',level:2};
  return{label:'🟢低',color:'var(--green)',level:1};
}
function getSuggestion(item){
  const type=item.concept.type_name;
  if(type==='核心概念')return'📖 核心概念，需彻底理解，结合教材溯源加深记忆';
  if(type==='常考概念')return'📚 常考考点，背熟定义并做3道同类题巩固';
  if(type==='易错概念')return'⚠️ 易混易错，注意辨析陷阱，重做错题检验掌握程度';
  return'🌱 基础概念，快速浏览回顾即可';
}
function generatePlan(){
  // Build concept errors, with fallback to knowledge_point for NULL concept_id
  const conceptErrors={};
  const kpErrors={};
  wrongQ.forEach(q=>{
    if(q.concept_id){
      if(!conceptErrors[q.concept_id])conceptErrors[q.concept_id]={count:0,questions:[],kps:new Set()};
      conceptErrors[q.concept_id].count++;
      conceptErrors[q.concept_id].questions.push(q);
      if(q.knowledge_point)conceptErrors[q.concept_id].kps.add(q.knowledge_point);
    }else{
      const kp=q.knowledge_point||'未分类';
      if(!kpErrors[kp])kpErrors[kp]={count:0,questions:[]};
      kpErrors[kp].count++;
      kpErrors[kp].questions.push(q);
    }
  });
  // Prioritized items from concept_id
  const prioritized=Object.entries(conceptErrors).map(([cid,data])=>{
    const c=conceptMap[parseInt(cid)];
    return{concept:c,errors:data.count,kps:[...data.kps],score:data.count*(5-(c?c.priority:2)),key:cid};
  }).filter(x=>x.concept).sort((a,b)=>b.score-a.score);
  // Fallback items
  const fallbackItems=Object.entries(kpErrors).map(([kp,data])=>{
    return{concept:{name:kp+' 📌',type_name:'易错概念',priority:2},errors:data.count,kps:[kp],score:data.count*3,key:kp,isFallback:true};
  }).sort((a,b)=>b.score-a.score);
  const allItems=[...prioritized,...fallbackItems];
  // Load completion states from localStorage
  const completedCount=allItems.filter((item,i)=>localStorage.getItem('baoke-plan-list-item-'+i)==='1').length;
  // Build list HTML
  let listHtml='<div class=card style=margin-bottom:12px>'
    +'<div class=card-title><span class=ico>📋</span> 薄弱知识点清单</div>'
    +'<div style=font-size:13px;color:var(--text2);margin-bottom:12px>共 <strong>'+allItems.length+'</strong> 个薄弱项 · 已掌握 <strong>'+completedCount+'</strong> 个</div>'
    +'<div class=flex-c style=gap:6px>'
    +allItems.map((item,i)=>{
      const itemDone=localStorage.getItem('baoke-plan-list-item-'+i)==='1';
      const prio=getPriorityLabel(item.score,item.errors,item.concept.type_name);
      const tierColors={'核心概念':'var(--red)','常考概念':'var(--accent)','易错概念':'var(--orange)','边缘概念':'var(--text3)'};
      const tierColor=tierColors[item.concept.type_name]||'var(--text3)';
      const suggestion=getSuggestion(item);

// Start study from checked list items
function startStudyFromPlanList(){
  const allItems=[]; // re-derive from same logic
  const conceptErrors={};
  const kpErrors={};
  wrongQ.forEach(q=>{
    if(q.concept_id){
      if(!conceptErrors[q.concept_id])conceptErrors[q.concept_id]={count:0,questions:[],kps:new Set()};
      conceptErrors[q.concept_id].count++;
      conceptErrors[q.concept_id].questions.push(q);
      if(q.knowledge_point)conceptErrors[q.concept_id].kps.add(q.knowledge_point);
    }else{
      const kp=q.knowledge_point||'未分类';
      if(!kpErrors[kp])kpErrors[kp]={count:0,questions:[]};
      kpErrors[kp].count++;
      kpErrors[kp].questions.push(q);
    }
  });
  const prioritized=Object.entries(conceptErrors).map(([cid,data])=>{
    const c=conceptMap[parseInt(cid)];
    return{concept:c,errors:data.count,kps:[...data.kps],score:data.count*(5-(c?c.priority:2)),key:cid};
  }).filter(x=>x.concept).sort((a,b)=>b.score-a.score);
  const fallbackItems=Object.entries(kpErrors).map(([kp,data])=>{
    return{concept:{name:kp+' 📌',type_name:'易错概念',priority:2},errors:data.count,kps:[kp],score:data.count*3,key:kp,isFallback:true};
  }).sort((a,b)=>b.score-a.score);
  const allItems=[...prioritized,...fallbackItems];
  // Get checked items
  const checkedKps=[];
  allItems.forEach((item,i)=>{
    if(localStorage.getItem('baoke-plan-list-item-'+i)==='1'){
      item.kps.forEach(kp=>checkedKps.push(kp));
    }
  });
  if(!checkedKps.length){alert('请先勾选要学习的薄弱知识点');return;}
  // Find wrong questions matching these KPs
  const relatedQs=wrongQ.filter(q=>{
    const kp=q.knowledge_point||'';
    return checkedKps.some(ck=>kp.includes(ck)||ck.includes(kp));
  });
  if(!relatedQs.length){alert('没有找到相关错题');return;}
  // Start online test with these questions
  testState.mode='easy';
  testState.qty=Math.min(10,relatedQs.length);
  testState.selectedKp='';
  testState.questions=shuffleArray([...relatedQs]).slice(0,testState.qty);
  testState.current=0;testState.correct=0;testState.answers=[];testState.userSelections={};
  testState.paperMode=true;
  testState.timer=0;
  if(testState.timerInterval)clearInterval(testState.timerInterval);
  testState.timerInterval=setInterval(()=>{testState.timer++;const m=String(Math.floor(testState.timer/60)).padStart(2,'0');const s=String(testState.timer%60).padStart(2,'0');$('testTimer').textContent='⏱ '+m+':'+s;},1000);
  $('testHeader').querySelector('span').textContent='📝 知识点巩固 · '+testState.questions.length+'题';
  $('testHeader').style.display='block';
  $('testOverlay').style.display='block';
  $('testModeScreen').style.display='none';
  $('testQuestionScreen').style.display='block';
  $('testResultScreen').style.display='none';
  $('testProgressFill').style.width='100%';
  renderExamPaper();
}

function buildKpSelector(){
  const kpSet=new Set();const qs=testState.mode==='mock'?_Q:wrongQ;

  const sorted=[...kpSet].sort();

function shuffleArray(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function beginTest(){
  const mode=testState.mode,qty=Math.min(testState.qty,30);
  let pool=[];
  if(mode==='mock'){
    pool=[..._Q];
  }else if(mode==='kp'){
    if(testState.selectedKp){
      pool=wrongQ.filter(q=>q.knowledge_point===testState.selectedKp);
    }else{
      pool=[...wrongQ];
    }
  }else{ // easy
    const kpErr={};wrongQ.forEach(q=>{const kp=q.knowledge_point||'(None)';kpErr[kp]=(kpErr[kp]||0)+1;});
    const sortedKps=Object.entries(kpErr).sort((a,b)=>b[1]-a[1]);
    pool=[];
    const kpPool={};sortedKps.forEach(([kp])=>{kpPool[kp]=wrongQ.filter(q=>(q.knowledge_point||'(None)')===kp);});
    let maxPerKp=Math.max(1,Math.ceil(qty/sortedKps.length));
    for(const [kp] of sortedKps){
      const taken=kpPool[kp].slice(0,maxPerKp);
      pool.push(...taken);
      if(pool.length>=qty)break;
    }
    pool=pool.slice(0,qty);
  }
  testState.questions=shuffleArray([...pool]).slice(0,qty);
  testState.current=0;testState.correct=0;testState.answers=[];testState.userSelections={};
  if(!testState.questions.length){alert('没有符合条件的题目，请选择其他模式');return;}
  // Paper mode: show all questions at once
  testState.paperMode=true;
  $('testHeader').style.display='block';
  $('testModeScreen').style.display='none';
  $('testQuestionScreen').style.display='block';
  $('testResultScreen').style.display='none';
  // Update header info
  const modeLabel={easy:'易错题专练',kp:'知识点专练',mock:'模拟测试'}[mode]||'在线测试';
  $('testHeader').querySelector('span').textContent='📝 '+modeLabel+' · '+testState.questions.length+'题';
  // Update progress bar to show paper mode (full width, no progress)
  $('testProgressFill').style.width='100%';
  // Start timer
  testState.timer=0;
  if(testState.timerInterval)clearInterval(testState.timerInterval);
  testState.timerInterval=setInterval(()=>{testState.timer++;const m=String(Math.floor(testState.timer/60)).padStart(2,'0');const s=String(testState.timer%60).padStart(2,'0');$('testTimer').textContent='⏱ '+m+':'+s;},1000);
  renderExamPaper();
}

      +'</div>'

                +'<span class="paper-radio" style="width:16px;height:16px;border-radius:50%;border:2px solid '+(isSelected?'var(--accent)':'var(--border)')+';display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s">'
                +(isSelected?'<span style="width:8px;height:8px;border-radius:50%;background:var(--accent)"></span>':'')

function updatePaperAnsweredCount(){
  const answered=Object.keys(testState.userSelections).length;
  const el=$('paperAnsweredCount');
  if(el)el.textContent=answered;
}

function submitExam(){
  const qs=testState.questions;
  if(!qs.length)return;
  
  // Check unanswered questions
  const unanswered=[];
  qs.forEach((q,i)=>{
    if(testState.userSelections[i]===undefined)unanswered.push(i+1);
  });
  if(unanswered.length>0){
    if(!confirm('还有 '+unanswered.length+' 题未作答（第 '+unanswered.join(',')+' 题），确定要提交吗？'))return;
  }
  
  // Grade
  let correct=0;
  const answers=[];
  qs.forEach((q,i)=>{
    const selected=testState.userSelections[i];
    let isCorrect=false;
    if(selected!==undefined){
      // correct_answer is the index
      const ca=q.correct_answer;
      if(ca!==undefined && ca!==null && ca!==''){
        const correctIdx=parseInt(ca);
        isCorrect=(selected===correctIdx);
      }else{
        isCorrect=false;
      }
    }
    if(isCorrect)correct++;
    answers.push({qid:q.id,correct:isCorrect,selected:selected});
  });
  
  testState.correct=correct;
  testState.answers=answers;
  
  // Show result
  showResult();
  // Save test result to localStorage for dashboard
  const modeLabels = {'easy':'易错题专练','kp':'知识点专练','mock':'模拟测试'};
  const wrongKps = [];
  qs.forEach((q,i)=>{
    const a = testState.answers.find(aa => aa.qid === q.id);
    if(a && !a.correct && q.knowledge_point) wrongKps.push(q.knowledge_point);
  });
  saveTestResult({
    date: new Date().toISOString(),
    mode: testState.mode,
    modeLabel: modeLabels[testState.mode] || '在线测试',
    total: qs.length,
    correct: correct,
    wrong_kps: [...new Set(wrongKps)]
  });
}

  let wrongHtml='';

    wrongHtml='<div style=padding:12px;text-align:center;color:var(--text3);font-size:13px>🎉 全部答对！</div>';
  }
  
  $('testResultContent').innerHTML='<div style=text-align:center;margin-bottom:16px><div style=font-size:24px;font-weight:800>测试完成！</div></div>'
    +'<div style=display:flex;align-items:center;gap:20px;justify-content:center;margin-bottom:16px;flex-wrap:wrap><div class=donut-wrap>'+donutHtml+'</div></div>'
    +'<div style=text-align:center;font-size:15px;margin-bottom:4px><strong>'+correct+'</strong> / '+total+' 题正确</div>'
    +'<div style=text-align:center;font-size:12px;color:var(--text3);margin-bottom:16px>⏱ 用时 '+min+' 分 '+sec+' 秒</div>'
    +wrongHtml
    +'<div style=display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px>'
    +'<button class="btn btn-primary" onclick=restartOnlineTest() style=font-size:13px;padding:8px 20px>🔄 重新测试</button>'
    +'<button class="btn btn-outline" onclick=closeOnlineTest() style=font-size:13px;padding:8px 20px>↩ 返回错题诊疗</button></div>';
}
function restartOnlineTest(){
  startOnlineTest();
  selectTestMode(testState.mode);
  selectQty(testState.qty);
}
