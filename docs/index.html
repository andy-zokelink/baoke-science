<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>宝科科学备考 · Harry</title>
<script src="data.js"></script>
<style>
/* ═══ RESET & BASE ═══ */
:root{
  --bg:#f0f5fa;--bg2:#f7faff;--bg3:#e8f0f8;
  --accent:#1a73e8;--accent2:#1557b0;--accent-light:#d2e3fc;
  --text:#1a202c;--text2:#4a5568;--border:#cbd5e1;--card:#fff;
  --gold:#d69e2e;--green:#38a169;--red:#e53e3e;--blue:#3182ce;
  --purple:#805ad5;--teal:#319795;
  --tc:#e53e3e;--tco:#d69e2e;--th:#3182ce;--te:#a0aec0;
  --sh:0 1px 4px rgba(0,0,0,.08);--shl:0 4px 16px rgba(0,0,0,.12);
  --radius:10px;--radius-sm:6px;
}
.dark{
  --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;
  --accent:#60a5fa;--accent2:#3b82f6;--accent-light:#1e3a5f;
  --text:#e2e8f0;--text2:#94a3b8;--border:#475569;--card:#1e293b;
  --gold:#fbbf24;--green:#34d399;--red:#f87171;--blue:#60a5fa;
  --purple:#a78bfa;--teal:#2dd4bf;
  --tc:#f87171;--tco:#fbbf24;--th:#60a5fa;--te:#64748b;
  --sh:0 1px 4px rgba(0,0,0,.3);--shl:0 4px 16px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;min-height:100vh;transition:background .3s,color .3s}

/* ═══ HEADER ═══ */
.hdr{background:linear-gradient(135deg,#1a73e8,#0f5bb5);color:#fff;padding:10px 14px 7px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.dark .hdr{background:linear-gradient(135deg,#1e3a5f,#0f172a)}
.hdr-t{display:flex;align-items:center;justify-content:space-between}
.hdr h1{font-size:16px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.hdr h1 .sub{font-size:10.5px;opacity:.8;font-weight:400}
.sbar{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.schip{background:rgba(255,255,255,.18);border-radius:16px;padding:2px 8px;font-size:10px;display:flex;align-items:center;gap:3px}
.schip .n{font-weight:700;font-size:12px}
.pbar{height:3px;background:rgba(255,255,255,.25);border-radius:2px;margin-top:6px;overflow:hidden}
.pfill{height:100%;background:#ffd54f;border-radius:2px;transition:width .8s}
.theme-btn{background:rgba(255,255,255,.2);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.theme-btn:hover{background:rgba(255,255,255,.35)}

/* ═══ NAV ═══ */
.nav{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:54px;z-index:90}
.nav::-webkit-scrollbar{display:none}
.nav-t{flex:0 0 auto;padding:8px 10px;cursor:pointer;font-size:11.5px;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;display:flex;align-items:center;gap:3px}
.nav-t:hover{color:var(--accent);background:var(--accent-light)}
.nav-t.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.nav-t .bdg{background:var(--accent);color:#fff;border-radius:10px;padding:0 5px;font-size:9px;line-height:16px;min-width:16px;text-align:center}

/* ═══ SECTIONS ═══ */
.sec{display:none;padding:10px;max-width:1024px;margin:0 auto;animation:fi .25s}
.sec.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ═══ UTILITY ═══ */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.card-title{font-size:13.5px;font-weight:700;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;font-weight:600}
.badge.red{background:#fee2e2;color:var(--red);border:1px solid #fecaca}
.badge.green{background:#d1fae5;color:var(--green);border:1px solid #a7f3d0}
.badge.gold{background:#fef3c7;color:var(--gold);border:1px solid #fde68a}
.badge.blue{background:#dbeafe;color:var(--blue);border:1px solid #bfdbfe}
.badge.purple{background:#ede9fe;color:var(--purple);border:1px solid #ddd6fe}
.badge.teal{background:#ccfbf1;color:var(--teal);border:1px solid #99f6e4}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-card{text-align:center;padding:12px 8px;border-radius:var(--radius-sm);background:var(--bg3)}
.stat-card .big{font-size:28px;font-weight:800;line-height:1.2}
.stat-card .lbl{font-size:10px;color:var(--text2);margin-top:2px}
.stat-card.accent .big{color:var(--accent)}
.stat-card.green .big{color:var(--green)}
.stat-card.gold .big{color:var(--gold)}
.stat-card.red .big{color:var(--red)}
@media(max-width:480px){.grid-3{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}}

/* ═══ TAB 0: DASHBOARD ═══ */
.db-welcome{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.db-welcome .ava{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.db-welcome .info h2{font-size:17px;font-weight:700}
.db-welcome .info p{font-size:11.5px;color:var(--text2)}
.countdown{display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(135deg,#fef3c7,#fde68a);border-radius:var(--radius-sm);margin-top:8px}
.dark .countdown{background:linear-gradient(135deg,#422006,#78350f)}
.countdown .num{font-size:28px;font-weight:800;color:#d97706}
.countdown .lbl{font-size:11px;color:#92400e}
.dark .countdown .num{color:#fbbf24}
.dark .countdown .lbl{color:#fde68a}
.kp-rank{display:flex;flex-direction:column;gap:5px}
.kp-row{display:flex;align-items:center;gap:6px;font-size:11px}
.kp-row .pos{width:18px;height:18px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
.kp-row .pos.t1{background:var(--red);color:#fff}
.kp-row .pos.t2{background:var(--gold);color:#fff}
.kp-row .pos.t3{background:var(--blue);color:#fff}
.kp-row .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kp-row .bar{width:80px;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.kp-row .bar .fill{height:100%;border-radius:4px;transition:width .8s}
a.tab-link{color:var(--accent);text-decoration:none;font-weight:600;cursor:pointer}
a.tab-link:hover{text-decoration:underline}

/* ═══ TAB 1: KNOWLEDGE MAP ═══ */
.km-filters{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.km-fbtn{padding:4px 10px;border-radius:14px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:10.5px;color:var(--text2);transition:all .2s;white-space:nowrap}
.km-fbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.km-unit{margin-bottom:14px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.km-uhead{padding:10px 14px;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none;transition:background .2s;border-bottom:1px solid var(--border)}
.km-uhead .arrow{font-size:10px;transition:transform .2s;color:var(--text2)}
.km-uhead .arrow.open{transform:rotate(90deg)}
.km-uhead:hover{background:var(--bg3)}
.km-uhead .count{font-size:9.5px;color:var(--text2);font-weight:400;margin-left:auto}
.km-grid{display:flex;flex-wrap:wrap;gap:5px;padding:10px 14px}
.km-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border-radius:6px;font-size:10.5px;border:1.5px solid var(--border);cursor:pointer;transition:all .15s;line-height:1.2;max-width:100%}
.km-chip:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.km-chip.core{border-color:var(--tc);background:#fff5f5}
.km-chip.common{border-color:var(--tco);background:#fffbea}
.km-chip.hard{border-color:var(--th);background:#eff6ff}
.km-chip.edge{border-color:var(--te);background:#f7fafc}
.dark .km-chip.core{background:#3b1111}
.dark .km-chip.common{background:#3b2f0a}
.dark .km-chip.hard{background:#0f1f3b}
.dark .km-chip.edge{background:#1a202c}
.km-chip .sym{font-size:9px;opacity:.8;flex-shrink:0}
.km-chip .nm{overflow:hidden;text-overflow:ellipsis}
.km-chip .err{font-size:8px;background:var(--red);color:#fff;border-radius:8px;padding:0 4px;line-height:14px;min-width:14px;text-align:center;margin-left:2px}

/* ═══ TAB 2: WRONG CLINIC ═══ */
.wc-filters{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.wc-fbtn{padding:4px 10px;border-radius:14px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:10.5px;color:var(--text2);transition:all .2s;white-space:nowrap}
.wc-fbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.wc-group{margin-bottom:12px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.wc-ghead{padding:9px 12px;font-size:11.5px;font-weight:700;background:var(--bg3);cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none;border-bottom:1px solid var(--border)}
.wc-ghead .arrow{font-size:10px;transition:transform .2s}
.wc-ghead .arrow.open{transform:rotate(90deg)}
.wc-ghead .err-cnt{background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:9px;line-height:16px;margin-left:auto}
.wc-item{padding:10px 12px;border-left:3px solid var(--red);margin:6px 8px;background:var(--bg2);border-radius:var(--radius-sm)}
.wc-item .q{font-size:11.5px;line-height:1.6;margin-bottom:4px}
.wc-item .ans{font-size:10.5px;color:var(--text2);display:flex;gap:8px;flex-wrap:wrap}
.wc-item .ans .u{color:var(--red);font-weight:600}
.wc-item .ans .c{color:var(--green)}
.wc-item .cause{margin-top:5px;font-size:10.5px;padding:6px 8px;background:var(--accent-light);border-radius:var(--radius-sm);color:var(--text)}
.wc-item .cause b{color:var(--accent)}
.wc-item .strategy{margin-top:4px;font-size:10px;color:var(--text2);font-style:italic}
.wc-item .src{font-size:9.5px;color:var(--text2);margin-top:4px;opacity:.7}

/* ═══ TAB 3: KNOWLEDGE GRAPH ═══ */
.graph-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:grab;position:relative}
.graph-wrap:active{cursor:grabbing}
#graph-svg{width:100%;min-height:500px;display:block}
.graph-lgnd{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px;border-top:1px solid var(--border);font-size:10.5px;align-items:center;background:var(--bg2)}
.graph-lgnd .item{display:flex;align-items:center;gap:4px}
.graph-lgnd .dot{width:8px;height:8px;border-radius:50%}
.graph-lgnd .sdot{width:20px;height:4px;border-radius:2px}
.graph-filter{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
.graph-filter .btn{padding:4px 10px;border-radius:14px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:10px;transition:all .2s}
.graph-filter .btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ═══ TAB 4: STUDY PLAN ═══ */
.sp-header{text-align:center;padding:16px;margin-bottom:12px;background:linear-gradient(135deg,var(--accent-light),var(--bg2));border-radius:var(--radius);border:1px solid var(--border)}
.sp-header .days{font-size:36px;font-weight:800;color:var(--accent);line-height:1.1}
.sp-header .lbl{font-size:12px;color:var(--text2)}
.sp-header .date{font-size:10.5px;color:var(--text2);margin-top:4px}
.sp-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
.sp-day{padding:8px 2px;border-radius:var(--radius-sm);text-align:center;font-size:9px;background:var(--bg3);color:var(--text2)}
.sp-day.strong{background:var(--accent-light);color:var(--accent);font-weight:700}
@media(max-width:480px){.sp-week{font-size:8px}.sp-day{padding:5px 1px}}
.sp-prio-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:11px}
.sp-prio-item:last-child{border-bottom:none}
.sp-prio-item .level{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.sp-prio-item .level.urgent{background:var(--red);color:#fff}
.sp-prio-item .level.imp{background:var(--gold);color:#fff}
.sp-prio-item .level.normal{background:var(--blue);color:#fff}
.sp-prio-item .name{flex:1}
.sp-prio-item .err-cnt{font-size:9px;color:var(--text2)}
.sp-tip{padding:10px 14px;background:var(--accent-light);border-radius:var(--radius-sm);font-size:11px;line-height:1.7;margin-top:10px}
.sp-tip b{color:var(--accent)}

/* ═══ TAB 5: TEXTBOOK ═══ */
.tb-filters{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.tb-fbtn{padding:4px 10px;border-radius:14px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:10.5px;color:var(--text2);transition:all .2s;white-space:nowrap}
.tb-fbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tb-page{margin-bottom:12px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.tb-phead{padding:9px 12px;font-size:12px;font-weight:700;background:var(--bg3);cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none}
.tb-phead .arrow{font-size:10px;transition:transform .2s}
.tb-phead .arrow.open{transform:rotate(90deg)}
.tb-phead .src{font-size:9.5px;color:var(--text2);font-weight:400;margin-left:auto}
.tb-items{padding:0}
.tb-q{padding:8px 12px;border-bottom:1px solid var(--border);font-size:11px;line-height:1.6;display:flex;gap:6px;align-items:flex-start}
.tb-q:last-child{border-bottom:none}
.tb-q .num{flex-shrink:0;font-size:9px;color:var(--text2);min-width:28px;padding-top:1px}
.tb-q .txt{flex:1}
.tb-q .ans{font-size:9.5px;color:var(--text2);margin-top:2px;display:flex;gap:6px}
.tb-q .ans .wrong{color:var(--red);font-weight:600}
.tb-q .ans .right{color:var(--green);font-weight:600}
.tb-q .ans .kp{background:var(--bg3);border-radius:3px;padding:0 5px;font-size:8.5px}

/* ═══ MODAL ═══ */
.moverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:14px}
.moverlay.open{display:flex}
.modal{background:var(--card);border-radius:12px;padding:18px;max-width:520px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:var(--shl)}
.mtitle{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.mclose{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2);line-height:1;padding:0 4px}
.msym{font-size:10px;background:var(--bg3);border-radius:4px;padding:2px 6px;margin-bottom:8px;display:inline-block;color:var(--text2)}
.mbody{font-size:12px;line-height:1.8;color:var(--text)}
.msec{margin-top:8px}
.msec h4{font-size:10.5px;color:var(--text2);margin-bottom:2px;font-weight:700}
.msec p{font-size:11.5px;color:var(--text);line-height:1.7}
.trapbox{background:var(--accent-light);border-radius:6px;padding:7px 9px;font-size:11px;color:var(--accent);margin-top:6px;line-height:1.6}
.m-err{font-size:11px;color:var(--red);font-weight:600;margin-top:6px}
.m-err-qs{margin-top:6px}
.m-err-qs .eq{font-size:10px;padding:4px 0;border-bottom:1px solid var(--border);color:var(--text2)}
.m-err-qs .eq:last-child{border-bottom:none}

/* ═══ RESPONSIVE ═══ */
@media(min-width:640px){
  .sec{padding:14px 16px}
  .grid-2{grid-template-columns:1fr 1fr}
}
@media(max-width:380px){
  .nav-t{font-size:10px;padding:7px 6px}
  .hdr h1{font-size:14px}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-t">
    <h1>🧪 <span id="hdr-name">科学备考</span> <span class="sub" id="hdr-school"></span></h1>
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="切换主题">🌙</button>
  </div>
  <div class="sbar" id="hdr-stats"></div>
  <div class="pbar"><div class="pfill" id="hdr-pbar" style="width:0%"></div></div>
</div>

<nav class="nav" id="main-nav"></nav>

<!-- ═══ TAB 0: DASHBOARD ═══ -->
<div class="sec on" id="sec0"></div>
<!-- ═══ TAB 1: KNOWLEDGE MAP ═══ -->
<div class="sec" id="sec1"></div>
<!-- ═══ TAB 2: WRONG CLINIC ═══ -->
<div class="sec" id="sec2"></div>
<!-- ═══ TAB 3: KNOWLEDGE GRAPH ═══ -->
<div class="sec" id="sec3"></div>
<!-- ═══ TAB 4: STUDY PLAN ═══ -->
<div class="sec" id="sec4"></div>
<!-- ═══ TAB 5: TEXTBOOK ═══ -->
<div class="sec" id="sec5"></div>

<!-- ═══ MODAL ═══ -->
<div class="moverlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="mtitle"><span id="modal-name"></span><button class="mclose" onclick="closeModal()">&times;</button></div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// DATA PREP
// ═══════════════════════════════════════════
const D = BAOKE_DATA;
const QS = D.questions;
const CON = D.concepts;
const PGS = D.source_pages;
const ST = D.stats;
const STUDENT = D.student;
const COURSE = D.course;

// Compute accuracy stats
let totalQ = QS.length;
let correctQ = QS.filter(q => q.is_correct === '✓').length;
let wrongQ = QS.filter(q => q.is_correct === '✗').length;
let halfQ = QS.filter(q => q.is_correct === '半对').length;
let unattemptedQ = QS.filter(q => q.is_correct === '未答' || q.is_correct === null).length;
let answeredQ = correctQ + wrongQ + halfQ;
let accuracyPct = answeredQ > 0 ? Math.round((correctQ + halfQ * 0.5) / answeredQ * 100) : 0;
let rawPct = totalQ > 0 ? Math.round((correctQ + halfQ * 0.5) / totalQ * 100) : 0;

// Concept lookup by id
const CON_MAP = {};
CON.forEach(c => { CON_MAP[c.id] = c; });

// Count errors per concept
const ERR_BY_CONCEPT = {};
const ERR_BY_KP = {};
// Build quick Q lookup
const Q_MAP = {};
QS.forEach(q => { Q_MAP[q.id] = q; });
// Question text + source_page_id → question lookup
const Q_TEXT_MAP = {};
QS.forEach(q => {
  if (q.question_text && q.source_page_id) {
    Q_TEXT_MAP[q.question_text + '|' + q.source_page_id] = q;
  }
});
ST.wrong_answers.forEach(w => {
  const kp = w.knowledge_point || '未知';
  ERR_BY_KP[kp] = (ERR_BY_KP[kp] || 0) + 1;
  // Map wrong answer → question → concept
  const q = Q_MAP[w.question_id];
  if (q && q.concept_id) {
    ERR_BY_CONCEPT[q.concept_id] = (ERR_BY_CONCEPT[q.concept_id] || 0) + 1;
  }
});

// Count questions per concept
const QS_BY_CONCEPT = {};
QS.forEach(q => {
  if (q.concept_id) {
    QS_BY_CONCEPT[q.concept_id] = QS_BY_CONCEPT[q.concept_id] || [];
    QS_BY_CONCEPT[q.concept_id].push(q);
  }
});

// Group concepts by unit
const CON_BY_UNIT = {};
CON.forEach(c => {
  const u = c.unit || '其他';
  if (!CON_BY_UNIT[u]) CON_BY_UNIT[u] = [];
  CON_BY_UNIT[u].push(c);
});
const UNIT_ORDER = ['物质科学', '生命科学', '地球宇宙', '地球的运动', '微小世界', '能量', '能量从哪里来', '工具与技术', '工具和机械', '工具与机械', '第一单元 紧密联系的工具和技术', '第一单元', '地球——宇宙的奇迹', '微生物与健康', '信息与交流', '科学探究', '其他'];

const TYPE_NAME = { 1: '核心概念', 2: '常考概念', 3: '易错概念', 4: '边缘概念' };

// Priority sort for units
function sortUnits(units) {
  const order = {};
  UNIT_ORDER.forEach((u, i) => order[u] = i);
  units.sort((a, b) => (order[a] ?? 999) - (order[b] ?? 999));
  return units;
}

let graphRendered = false;

function renderGraph() {
  if (graphRendered) return;
  graphRendered = true;
  const sec = document.getElementById('sec3');

  // Build graph from concepts that have errors
  const nodes = [];
  const nodeMap = {};
  CON.forEach(c => {
    const errCnt = ERR_BY_CONCEPT[c.id] || 0;
    if (errCnt > 0 || true) {  // include all concepts for richer graph
      nodes.push({
        id: c.id,
        name: c.name,
        priority: c.priority,
        symbol: c.symbol || TYPE_ICON[c.priority],
        unit: c.unit || '其他',
        errCnt: errCnt,
        radius: Math.max(5, Math.min(16, 5 + errCnt * 2))
      });
      nodeMap[c.id] = nodes.length - 1;
    }
  });

  // Build edges: connect concepts in same unit
  const edges = [];
  const units = {};
  CON.forEach(c => {
    const u = c.unit || '其他';
    if (!units[u]) units[u] = [];
    units[u].push(c.id);
  });
  Object.values(units).forEach(ids => {
    for (let i = 0; i < ids.length - 1; i++) {
      for (let j = i + 1; j < ids.length; j++) {
        if (nodeMap[ids[i]] !== undefined && nodeMap[ids[j]] !== undefined) {
          edges.push({ source: nodeMap[ids[i]], target: nodeMap[ids[j]] });
        }
      }
    }
  });

  // Also connect concepts that share knowledge_points via questions
  const kpGroups = {};
  QS.forEach(q => {
    if (q.concept_id && q.knowledge_point) {
      if (!kpGroups[q.knowledge_point]) kpGroups[q.knowledge_point] = new Set();
      kpGroups[q.knowledge_point].add(q.concept_id);
    }
  });
  Object.values(kpGroups).forEach(conSet => {
    const ids = [...conSet].filter(id => nodeMap[id] !== undefined);
    for (let i = 0; i < Math.min(ids.length, 5); i++) {
      for (let j = i + 1; j < Math.min(ids.length, 5); j++) {
        const exists = edges.some(e => e.source === nodeMap[ids[i]] && e.target === nodeMap[ids[j]]);
        if (!exists) {
          edges.push({ source: nodeMap[ids[i]], target: nodeMap[ids[j]] });
        }
      }
    }
  });

  // Limit to top 80 nodes by error count for performance
  const sortedNodes = [...nodes].sort((a, b) => b.errCnt - a.errCnt);
  const top80 = new Set(sortedNodes.slice(0, 80).map(n => n.id));
  const filteredNodes = nodes.filter(n => top80.has(n.id));
  const filteredNodeIds = new Set(filteredNodes.map((n, i) => { n.idx = i; return n.id; }));
  const filteredEdges = edges.filter(e => filteredNodeIds.has(nodes[e.source].id) && filteredNodeIds.has(nodes[e.target].id));

  // Reindex
  const idMap = {};
  filteredNodes.forEach((n, i) => { idMap[n.id] = i; });
  const reindexedEdges = filteredEdges.map(e => ({
    source: idMap[nodes[e.source].id],
    target: idMap[nodes[e.target].id]
  }));

  // Force layout
  const W = 900, H = 600;
  const positions = forceLayout(filteredNodes, reindexedEdges, W, H);

  // Colors by priority
  const PCOLORS = ['#e53e3e', '#d69e2e', '#3182ce', '#a0aec0'];
  const DARK_PCOLORS = ['#f87171', '#fbbf24', '#60a5fa', '#64748b'];

  // Render SVG
  const isDark = document.body.classList.contains('dark');
  const colors = PCOLORS.map((c, i) => isDark ? DARK_PCOLORS[i] : c);
  let svg = `<div class="card" style="margin-bottom:8px">
    <div class="card-title">🕸 概念关系图谱</div>
    <div style="font-size:10.5px;color:var(--text2)">节点大小 = 错题数量 · 同单元/知识点相连</div>
  </div>`;

  svg += `<div class="graph-filter">
    <div class="btn on" onclick="renderGraph()">刷新布局</div>
  </div>`;

  svg += `<div class="graph-wrap" id="graph-wrap">
    <svg id="graph-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"
      onmousedown="startGraphDrag(event)" onmousemove="graphDrag(event)" onmouseup="stopGraphDrag()" onmouseleave="stopGraphDrag()">
      <defs>
        <filter id="gshadow"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity=".25"/></filter>
      </defs>`;

  // Edges
  reindexedEdges.forEach(e => {
    const s = positions[e.source], t = positions[e.target];
    if (s && t) {
      svg += `<line x1="${s.x}" y1="${s.y}" x2="${t.x}" y2="${t.y}" stroke="${isDark?'#475569':'#cbd5e1'}" stroke-width="1" opacity=".4"/>`;
    }
  });

  // Nodes
  filteredNodes.forEach((n, i) => {
    const p = positions[i];
    if (!p) return;
    const col = colors[Math.min(n.priority - 1, 3)] || '#a0aec0';
    const r = n.radius;
    svg += `<g style="cursor:pointer" onclick="showNodeDetail(${n.id})">
      <circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${col}" opacity=".85" stroke="#fff" stroke-width="1.5" filter="url(#gshadow)"/>
      ${n.errCnt > 0 ? `<text x="${p.x}" y="${p.y+1}" text-anchor="middle" fill="#fff" font-size="${r>10?'9':'7'}" font-weight="700">${n.errCnt}</text>` : ''}
    </g>`;
  });

  // Labels on larger nodes
  filteredNodes.forEach((n, i) => {
    const p = positions[i];
    if (!p || n.radius < 8) return;
    svg += `<text x="${p.x}" y="${p.y + n.radius + 11}" text-anchor="middle" fill="${isDark?'#94a3b8':'#4a5568'}" font-size="8" style="pointer-events:none">${esc(n.name.length > 8 ? n.name.slice(0,8)+'…' : n.name)}</text>`;
  });

  svg += `</svg></div>`;

  // Legend
  svg += `<div class="graph-lgnd">
    <span style="font-weight:600;font-size:10px">图例：</span>
    ${[['★★★ 核心','var(--red)'],['★★ 常考','var(--gold)'],['★ 易错','var(--blue)'],['· 边缘','var(--teal)']].map(([l,c]) =>
      `<span class="item"><span class="dot" style="background:${c}"></span>${l}</span>`
    ).join('')}
  </div>`;

  sec.innerHTML = svg;
}

// Force-directed layout (simple)
function forceLayout(nodes, edges, W, H) {
  const n = nodes.length;
  const pos = nodes.map((node, i) => ({
    x: W/2 + (Math.random() - 0.5) * W * 0.6,
    y: H/2 + (Math.random() - 0.5) * H * 0.6,
    vx: 0, vy: 0
  }));

  const REP_STR = 800, ATT_STR = 0.003, CENTER_STR = 0.01;
  const ITER = 80;
  const EDGE_LEN = 80;

  for (let iter = 0; iter < ITER; iter++) {
    const damping = 1 - iter / ITER;
    // Repulsion
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        let dx = pos[j].x - pos[i].x;
        let dy = pos[j].y - pos[i].y;
        let dist = Math.sqrt(dx * dx + dy * dy) || 1;
        let force = REP_STR / (dist * dist);
        pos[i].vx -= force * dx / dist * damping;
        pos[i].vy -= force * dy / dist * damping;
        pos[j].vx += force * dx / dist * damping;
        pos[j].vy += force * dy / dist * damping;
      }
    }
    // Attraction
    edges.forEach(e => {
      let dx = pos[e.target].x - pos[e.source].x;
      let dy = pos[e.target].y - pos[e.source].y;
      let dist = Math.sqrt(dx * dx + dy * dy) || 1;
      let force = (dist - EDGE_LEN) * ATT_STR * damping;
      pos[e.source].vx += force * dx / dist;
      pos[e.source].vy += force * dy / dist;
      pos[e.target].vx -= force * dx / dist;
      pos[e.target].vy -= force * dy / dist;
    });
    // Center
    pos.forEach(p => {
      p.vx += (W/2 - p.x) * CENTER_STR * damping;
      p.vy += (H/2 - p.y) * CENTER_STR * damping;
    });
    // Apply
    pos.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.x = Math.max(20, Math.min(W - 20, p.x));
      p.y = Math.max(20, Math.min(H - 20, p.y));
      p.vx *= 0.9;
      p.vy *= 0.9;
    });
  }
  return pos;
}

// Graph drag
let graphDragging = false, graphStart = null, graphScroll = null;
function startGraphDrag(e) {
  const wrap = document.getElementById('graph-wrap');
  if (!wrap) return;
  graphDragging = true;
  graphStart = { x: e.clientX, y: e.clientY };
  graphScroll = { l: wrap.scrollLeft, t: wrap.scrollTop };
}
function graphDrag(e) {
  if (!graphDragging) return;
  const wrap = document.getElementById('graph-wrap');
  if (wrap && graphStart) {
    wrap.scrollLeft = graphScroll.l - (e.clientX - graphStart.x);
    wrap.scrollTop = graphScroll.t - (e.clientY - graphStart.y);
  }
}
function stopGraphDrag() { graphDragging = false; }

  showConceptModal(conceptId);
}

// TAB 4: STUDY PLAN
// ═══════════════════════════════════════════
function renderStudyPlan() {
  const sec = document.getElementById('sec4');

  // Group wrong by concept for priority list
  const conceptErrors = {};
  ST.wrong_answers.forEach(w => {
    const q = Q_MAP[w.question_id];
    if (q && q.concept_id) {
      conceptErrors[q.concept_id] = (conceptErrors[q.concept_id] || 0) + 1;
    }
  });

  // Build priority list
  const priorityList = CON.filter(c => conceptErrors[c.id] > 0)
    .map(c => ({
      ...c,
      errCnt: conceptErrors[c.id],
      priorityScore: (c.priority === 1 ? 100 : c.priority === 2 ? 70 : c.priority === 3 ? 50 : 20) + conceptErrors[c.id] * 10
    }))
    .sort((a, b) => b.priorityScore - a.priorityScore);

  // Weekly schedule
  const weekDays = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  const todayIdx = TODAY.getDay();
  const weekStart = (todayIdx === 0 ? 6 : todayIdx - 1); // Monday=0

  // Daily recommended review count
  const dailyTarget = Math.ceil(wrongQ / Math.max(DAYS_LEFT, 1));

  // Urgent: 核心概念 with errors
  const urgent = priorityList.filter(c => c.priority <= 2).slice(0, 10);
  const imp = priorityList.filter(c => c.priority >= 3).slice(0, 10);
  const normal = CON.filter(c => !conceptErrors[c.id] && c.priority <= 2).slice(0, 8);

  const nowDate = new Date();
  const dateStr = `${nowDate.getFullYear()}/${nowDate.getMonth()+1}/${nowDate.getDate()}`;

  sec.innerHTML = `
    <div class="sp-header">
      <div class="days">${DAYS_LEFT}</div>
      <div class="lbl">距离考试（预计6月27日）</div>
      <div class="date">📅 今天 ${dateStr} · 每天建议复习 ${dailyTarget} 道错题</div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-title">📅 本周日程</div>
        <div class="sp-week">
          ${weekDays.map((d, i) => {
            const isToday = i === (todayIdx === 0 ? 6 : todayIdx - 1);
            const isWeekend = i >= 5;
            return `<div class="sp-day ${isToday?'strong':''}" style="${isWeekend?'opacity:.7':''}">
              ${d}<br>${isToday?'📌':isWeekend?'🎯':''}
              ${isToday ? dailyTarget+'题' : ''}
            </div>`;
          }).join('')}
        </div>
        <div style="font-size:10px;color:var(--text2);text-align:center">
          周末集中攻克高频错题，工作日每天${dailyTarget}题保持手感
        </div>
      </div>

      <div class="card">
        <div class="card-title">📋 复习进度</div>
        <div class="grid-2">
          <div class="stat-card green"><div class="big">${correctQ}</div><div class="lbl">已掌握</div></div>
          <div class="stat-card gold"><div class="big">${wrongQ + halfQ}</div><div class="lbl">待复习</div></div>
        </div>
        <div style="margin-top:8px">
          <div class="kp-row"><span class="name">总进度</span>
            <div class="bar"><div class="fill" style="width:${accuracyPct}%;background:var(--green)"></div></div>
            <span style="font-size:10px;font-weight:600;color:var(--green)">${accuracyPct}%</span>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🔴 紧急优先 · 核心/常考概念有错题</div>
      ${urgent.length === 0 ? '<div style="font-size:11px;color:var(--text2)">🎉 核心概念没有错题！</div>' :
        urgent.map((c, i) => `<div class="sp-prio-item">
          <div class="level urgent">${i+1}</div>
          <span class="name"><b>${esc(c.name)}</b></span>
          <span class="err-cnt">${c.errCnt}错题</span>
        </div>`).join('')}
    </div>

    <div class="card">
      <div class="card-title">🟡 重要 · 易错/边缘概念巩固</div>
      ${imp.length === 0 ? '<div style="font-size:11px;color:var(--text2)">✨ 这部分已掌握</div>' :
        imp.map((c, i) => `<div class="sp-prio-item">
          <div class="level imp">${i+1}</div>
          <span class="name"><b>${esc(c.name)}</b></span>
          <span class="err-cnt">${c.errCnt}错题</span>
        </div>`).join('')}
    </div>

    <div class="card">
      <div class="card-title">🟢 预习 · 零错题核心概念</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">
        ${normal.map(c => `<span class="km-chip ${TYPE_CLASS[c.priority]}" onclick="showConceptModal(${c.id})">
          <span class="sym">${c.symbol}</span>${esc(c.name)}
        </span>`).join('')}
      </div>
    </div>

    <div class="sp-tip">
      <b>📌 复习策略：</b><br>
      ① 优先复习🔴紧急区，这些是考试重点且有错题积累<br>
      ② 每日坚持做 ${dailyTarget} 道错题重做，记录不会的知识点<br>
      ③ 周末用完整时间做一次模拟考试（30题/15分钟）<br>
      ④ 考前3天回归教材，浏览所有页面查漏补缺<br>
      ⑤ 🧘 保证睡眠，考试当天带好文具和自信！
    </div>
  `;
}
renderStudyPlan();

// ═══════════════════════════════════════════
// TAB 5: TEXTBOOK SOURCE
// ═══════════════════════════════════════════
let tbFilter = 'all';

function renderTextbook(filter) {
  filter = filter || tbFilter;
  tbFilter = filter;
  const sec = document.getElementById('sec5');
  const mats = Object.keys(PGS_BY_MAT).sort();

  const flatPages = PGS.slice().sort((a, b) => {
    if (a.material_title !== b.material_title) return a.material_title?.localeCompare(b.material_title || '');
    return (a.page_number || 0) - (b.page_number || 0);
  });

  // Filter pages
  let displayPages = flatPages;
  if (filter === 'has_err') {
    // Find pages with wrong answers
    const wrongQIds = new Set(ST.wrong_answers.map(w => w.question_id));
    displayPages = flatPages.filter(p => {
      if (!p.parsed) return false;
      return p.parsed.some(q => {
        const matched = Q_TEXT_MAP[q.题目 + '|' + p.id];
        return matched && wrongQIds.has(matched.id);
      });
    });
  } else if (filter === 'has_content') {
    displayPages = flatPages.filter(p => p.parsed && p.parsed.length > 0);
  }

  // Filter buttons
  let html = `<div class="card">
    <div class="card-title">📖 教材溯源</div>
    <div style="font-size:11px;color:var(--text2)">共 ${PGS.length} 页 · ${mats.length} 份材料</div>
  </div>
  <div class="tb-filters">
    <div class="tb-fbtn ${filter==='all'?'on':''}" onclick="renderTextbook('all')">全部 (${PGS.length})</div>
    <div class="tb-fbtn ${filter==='has_content'?'on':''}" onclick="renderTextbook('has_content')">有题目 (${flatPages.filter(p=>p.parsed&&p.parsed.length>0).length})</div>
    <div class="tb-fbtn ${filter==='has_err'?'on':''}" onclick="renderTextbook('has_err')">有错题</div>
  </div>`;

  // Group display pages by material
  const grouped = {};
  displayPages.forEach(p => {
    const m = p.material_title || '未知';
    if (!grouped[m]) grouped[m] = [];
    grouped[m].push(p);
  });

  Object.entries(grouped).forEach(([mat, pages]) => {
    html += `<div style="font-size:11px;font-weight:700;color:var(--text2);margin:8px 0 4px 4px">📁 ${esc(mat)} (${pages.length}页)</div>`;
    pages.forEach(p => {
      const parsed = p.parsed || [];
      const hasErr = parsed.some(q => {
        const matched = Q_TEXT_MAP[q.题目 + '|' + p.id];
        return matched && matched.is_correct === '✗';
      });
      html += `<div class="tb-page" style="${hasErr?'border-left:3px solid var(--red)':''}">
        <div class="tb-phead" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none';this.querySelector('.arrow').classList.toggle('open')">
          <span class="arrow open">▶</span>
          第 ${p.page_number} 页 ${hasErr ? '⚠️' : ''}
          <span class="src">${parsed.length} 题</span>
        </div>
        <div class="tb-items">`;
      if (parsed.length === 0) {
        html += `<div class="tb-q" style="color:var(--text2);font-size:10px">此页暂未提取到题目</div>`;
      } else {
        parsed.forEach(q => {
          const matched = Q_TEXT_MAP[q.题目 + '|' + p.id];
          const isWrong = matched && matched.is_correct === '✗';
          html += `<div class="tb-q">
            <span class="num">${esc(q.题号 || '?')}</span>
            <div class="txt">
              <div>${esc(q.题目 || '')}</div>
              <div class="ans">
                <span>${isWrong ? '<span class="wrong">✗ ' + esc(q.学生作答 || '') + '</span>' : '<span class="right">✓ ' + esc(q.学生作答 || '') + '</span>'}</span>
                ${q.知识点 ? `<span class="kp">${esc(q.知识点)}</span>` : ''}
              </div>
            </div>
          </div>`;
        });
      }
      html += `</div></div>`;
    });
  });
  sec.innerHTML = html;
}
renderTextbook();

// ═══════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════
function showConceptModal(id) {
  const c = CON_MAP[id];
  if (!c) return;
  const rawDef = c.definition || '暂无定义';
  const mainDef = rawDef.split('|')[0].trim();
  const trap = rawDef.includes('陷阱') ? rawDef.split('陷阱')[1].replace(/^[:：]/, '').trim() : '';
  const errCnt = ERR_BY_CONCEPT[c.id] || 0;

  // Find related questions
  const relatedQs = QS_BY_CONCEPT[c.id] || [];
  const wrongRelated = relatedQs.filter(q => q.is_correct === '✗');

  document.getElementById('modal-name').textContent = c.name;
  let body = `<span class="msym">${c.symbol || TYPE_ICON[c.priority] || '★★'} ${TYPE_NAME[c.priority] || ''}</span>
    <div class="mbody">${esc(mainDef)}</div>`;

  if (c.example) body += `<div class="msec"><h4>📌 典型例子</h4><p>${esc(c.example)}</p></div>`;
  if (c.analogy) body += `<div class="msec"><h4>🔗 类比记忆</h4><p>${esc(c.analogy)}</p></div>`;
  if (trap) body += `<div class="trapbox">⚠️ <b>常见陷阱：</b>${esc(trap)}</div>`;

  if (errCnt > 0) {
    body += `<div class="m-err">🔴 历史错误次数: ${errCnt}</div>`;
    if (wrongRelated.length > 0) {
      body += `<div class="m-err-qs"><h4 style="font-size:10.5px;color:var(--red);margin-bottom:3px">相关错题：</h4>`;
      wrongRelated.slice(0, 5).forEach(q => {
        body += `<div class="eq">❌ ${esc(q.question_number || '')} ${esc(q.question_text || '').slice(0, 40)}${(q.question_text||'').length > 40 ? '…' : ''}</div>`;
      });
      if (wrongRelated.length > 5) body += `<div class="eq" style="color:var(--text2)">…还有${wrongRelated.length - 5}道错题</div>`;
      body += `</div>`;
    }
  }

  if (c.counter_example) body += `<div class="msec"><h4>⚠️ 反例辨析</h4><p>${esc(c.counter_example)}</p></div>`;
  if (c.unit) body += `<div class="msec"><h4>📂 所属单元</h4><p>${esc(c.unit)}</p></div>`;

  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}

// ═══════════════════════════════════════════
// UTILITY
// ═══════════════════════════════════════════
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

  graphRendered = false; // force re-render on next graph tab switch
